      const d=new Date(); d.setMonth(d.getMonth()-i); d.setDate(1);
      const yy=d.getFullYear(), mm=d.getMonth();
      const items = validadas.filter(f=>{ const fd=new Date(f.data_ocorrencia); return fd.getFullYear()===yy&&fd.getMonth()===mm; });
      months.push({ lbl:d.toLocaleDateString("pt-BR",{month:"short"}), sum:items.reduce((s,f)=>s+(+f.tempo_parada||0),0), cnt:items.length });
    }
    return {
      type:"bar",
      data:{
        labels:months.map(m=>m.lbl),
        datasets:[
          { type:"bar",  label:"Parada (min)", data:months.map(m=>m.sum), backgroundColor:meta.accent, borderRadius:6, yAxisID:"y" },
          { type:"line", label:"Nº falhas",    data:months.map(m=>m.cnt), borderColor:"#fff", backgroundColor:"#fff", tension:.4, yAxisID:"y1", pointRadius:4 },
        ]
      },
      options:{
        scales:{
          y:{ beginAtZero:true, position:"left" },
          y1:{ beginAtZero:true, position:"right", grid:{ drawOnChartArea:false }, ticks:{ stepSize:1 } }
        }
      }
    };
  }, [validadas, meta]);

  return (
    <div className="space-y-5">
      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        {/* Card principal */}
        <div className="panel p-6 lg:col-span-2 relative overflow-hidden scanlines">
          <div className="absolute -right-8 -top-8 w-44 h-44 rounded-full pointer-events-none"
            style={{background:`radial-gradient(circle,${meta.accent}30,transparent 70%)`}}/>
          <div className="flex items-center gap-3">
            <div className="w-12 h-12 rounded-xl flex items-center justify-center"
              style={{color:meta.accent,background:`color-mix(in srgb,${meta.accent} 18%,transparent)`}}>
              <Icon name={meta.icon} size={26}/>
            </div>
            <div>
              <div className="crumb">{meta.desc}</div>
              <div className="text-xl font-extrabold">{meta.name}</div>
              <div className="text-xs mt-0.5" style={{color:"var(--txt-3)"}}>
                Validador: <span style={{color:"var(--txt-2)"}}>{val.nome}</span>
              </div>
            </div>
            <div className="ml-auto"><StatusTag status={status}/></div>
          </div>

          <div className="mt-6 grid grid-cols-2 gap-4">
            <div>
              <div className="crumb">Dias sem falha</div>
              <div className="mono font-extrabold leading-none mt-1" style={{fontSize:"4rem",color}}>
                {days===null ? "—" : days}
              </div>
              <div className="text-xs mt-1" style={{color:"var(--txt-3)"}}>
                Última: {fmtDate(last?.data_ocorrencia, true)}
              </div>
            </div>
            <div className="flex justify-end items-center">
              <Ring value={+rel.availability} color={color} size={140} stroke={11}/>
            </div>
          </div>

          <div className="mt-5 flex flex-wrap gap-2">
            <button className="btn btn-danger" onClick={()=>setModal(true)}>
              <Icon name="alert" size={14}/>Registrar Ocorrência
            </button>
          </div>

          {pendentes.length>0 && (
            <div className="mt-3 panel-flat px-3 py-2 text-xs flex items-center gap-2" style={{color:"#ffb627"}}>
              <Icon name="clock" size={13}/>
              {pendentes.length} ocorrência(s) aguardando validação de {val.nome}
            </div>
          )}
        </div>

        {/* Indicadores */}
        <div className="panel p-6 space-y-3">
          <div className="crumb">Indicadores (validados)</div>
          <KpiRow label="MTBF" value={`${rel.mtbf} dias`}/>
          <KpiRow label="MTTR" value={`${rel.mttr} min`}/>
          <KpiRow label="Disponibilidade 30d" value={`${rel.availability}%`}/>
          <KpiRow label="Total de ocorrências" value={rel.count}/>
          <KpiRow label="Última ocorrência" value={fmtDate(last?.data_ocorrencia)} small/>
          <KpiRow label="Motivo" value={last?.motivo||"—"} small/>
          <KpiRow label="Registrado por" value={last?`${last.registrado_por_nome} (${last.registrado_por_matricula})`:"—"} small/>
        </div>
      </div>

      <div className="panel p-5">
        <div className="crumb mb-1">Tendência</div>
        <div className="font-bold text-lg mb-4">Paradas por mês — últimos 6 meses</div>
        <ChartBox config={trendCfg} height={290}/>
      </div>

      <div className="panel p-5">
        <div className="crumb mb-1">Histórico validado</div>
        <div className="font-bold text-lg mb-4">Todas as ocorrências do sistema</div>
        <OcTable data={validadas}/>
      </div>

      <FailureModal open={modal} sysKey={sysKey} onClose={()=>setModal(false)} onDone={fetchData}/>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   PENDENTES
══════════════════════════════════════════════════════════════ */
function PendingPage() {
  const { oc, fetchData, isAnyValidador, meusSistemas, notify, user } = useApp();
  if(!isAnyValidador) return (
    <div className="panel p-8 text-center">
      <Icon name="lock" size={32} className="mx-auto mb-3" style={{color:"#ff4d6d"}}/>
      <div className="font-bold text-lg">Acesso restrito</div>
      <div className="text-sm mt-1" style={{color:"var(--txt-3)"}}>Apenas gerentes setoriais podem validar registros.</div>
    </div>
  );

  const pendentes = oc.filter(o=>o.status==="pendente")
    .sort((a,b)=>new Date(a.data_ocorrencia)-new Date(b.data_ocorrencia));

  const aprovar = async item => {
    try {
      const { error } = await db.from("ocorrencias")
        .update({ status:"validado", validado_em: new Date().toISOString() })
        .eq("id", item.id);
      if(error) throw error;

      const val = getValidador(item.sistema);
      notify("Validado! Abrindo e-mail para o Gerente Geral…", "info");
      setTimeout(() => openEmail(buildEmailValidado(item, val)), 900);
      await fetchData();
    } catch(e) { notify("Erro: "+e.message, "err"); }
  };

  const rejeitar = async item => {
    const motivo = prompt(`Informe o motivo do ajuste (será enviado por e-mail para ${item.registrado_por_nome}):`);
    if(!motivo?.trim()) return;
    try {
      const { error } = await db.from("ocorrencias")
        .update({ status:"rejeitado", motivo_rejeicao: motivo.trim() })
        .eq("id", item.id);
      if(error) throw error;
      const val = getValidador(item.sistema);
      const op = { nome:item.registrado_por_nome, email:item.registrado_por_email };
      notify("Rejeitado. Abrindo e-mail para o operador…", "info");
      setTimeout(() => openEmail(buildEmailRejeicao(item, op, motivo.trim(), val)), 900);
      await fetchData();
    } catch(e) { notify("Erro: "+e.message, "err"); }
  };

  const possoValidar = sysKey => meusSistemas.includes(sysKey);

  // Agrupar por validador para exibição
  const grupos = [
    { key:"bruno",   label:"Grupo Bruno Martins",  sistemas: Object.keys(SISTEMAS).filter(k=>SISTEMAS[k].validador==="bruno") },
    { key:"alfredo", label:"Grupo Alfredo Silva",   sistemas: Object.keys(SISTEMAS).filter(k=>SISTEMAS[k].validador==="alfredo") },
    { key:"paulo",   label:"Grupo Paulo Rultran",   sistemas: Object.keys(SISTEMAS).filter(k=>SISTEMAS[k].validador==="paulo") },
  ];

  return (
    <div className="space-y-5">
      {/* Cabeçalho validador */}
      <div className="panel p-5 flex items-center gap-3">
        <div className="w-10 h-10 rounded-lg flex items-center justify-center shrink-0"
          style={{background:"rgba(167,139,250,.14)",color:"#a78bfa"}}>
          <Icon name="shield"/>
        </div>
        <div className="flex-1">
          <div className="crumb">Modo validador</div>
          <div className="font-bold text-lg">Olá, {user.nome.split(" ")[0]}</div>
          <div className="text-xs mt-0.5" style={{color:"var(--txt-3)"}}>
            Você pode <strong>ver</strong> todos os registros pendentes, mas <strong>validar/rejeitar apenas</strong> os do seu grupo.
            Ao validar, o Gerente Geral {GERENTE_GERAL.nome} será notificado por e-mail.
          </div>
        </div>
        <div className="text-right shrink-0">
          <div className="mono font-extrabold text-3xl" style={{color:"#ffb627"}}>{pendentes.length}</div>
          <div className="crumb">pendente(s)</div>
        </div>
      </div>

      {pendentes.length===0 && (
        <div className="panel p-10 text-center">
          <Icon name="check" size={36} className="mx-auto mb-3" style={{color:"#00d9a3"}}/>
          <div className="font-bold text-lg">Nenhuma pendência!</div>
          <div className="text-sm mt-1" style={{color:"var(--txt-3)"}}>Todos os registros foram avaliados.</div>
        </div>
      )}

      {grupos.map(grupo => {
        const items = pendentes.filter(o => grupo.sistemas.includes(o.sistema));
        if(!items.length) return null;
        const euSouDono = meusSistemas.some(s=>grupo.sistemas.includes(s));
        return (
          <div key={grupo.key} className="panel p-5">
            <div className="flex items-center justify-between mb-4">
              <div>
                <div className="crumb">{grupo.label}</div>
                <div className="font-bold text-lg">{items.length} pendência(s)</div>
              </div>
              {!euSouDono && (
                <span className="badge tag-amber"><Icon name="lock" size={11}/>Somente leitura</span>
              )}
            </div>
            <div className="space-y-3">
              {items.map(item => {
                const sys = SISTEMAS[item.sistema];
                const podeAgir = possoValidar(item.sistema);
                return (
                  <div key={item.id} className={`panel-flat p-4 ${!podeAgir?"opacity-70":""}`}>
                    <div className="flex flex-wrap items-start justify-between gap-3">
                      <div className="flex-1 min-w-[260px]">
                        <div className="flex items-center gap-2 mb-1.5 flex-wrap">
                          <span className="badge" style={{
                            background:`color-mix(in srgb,${sys.accent} 14%,transparent)`,
                            color:sys.accent,
                            borderColor:`color-mix(in srgb,${sys.accent} 30%,transparent)`
                          }}>
                            <Icon name={sys.icon} size={11}/>{sys.name}
                          </span>
                          <span className="mono text-xs" style={{color:"var(--txt-3)"}}>
                            {fmtDate(item.data_ocorrencia, true)}
                          </span>
                        </div>
                        <div className="font-semibold">{item.motivo}</div>
                        <div className="text-xs mt-1" style={{color:"var(--txt-3)"}}>
                          Parada: <span className="mono">{item.tempo_parada} min</span>
                          {item.observacoes && <> · {item.observacoes}</>}
                        </div>
                        <div className="text-xs mt-2 flex items-center gap-1.5" style={{color:"var(--txt-2)"}}>
                          <Icon name="user" size={12}/>
                          <strong>{item.registrado_por_nome}</strong> · mat.{item.registrado_por_matricula} · {item.registrado_por_email}
                        </div>
                      </div>
                      {podeAgir ? (
                        <div className="flex gap-2 shrink-0">
                          <button className="btn btn-primary" onClick={()=>aprovar(item)}>
                            <Icon name="check" size={14}/>Validar
                          </button>
                          <button className="btn btn-danger" onClick={()=>rejeitar(item)}>
                            <Icon name="x" size={14}/>Rejeitar
                          </button>
                        </div>
                      ) : (
                        <span className="badge" style={{alignSelf:"flex-start"}}>
                          <Icon name="lock" size={11}/>Sem permissão
                        </span>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   HISTÓRICO
══════════════════════════════════════════════════════════════ */
function HistoryPage() {
  const { oc } = useApp();
  const [q, setQ] = useState("");
  const [sys, setSys] = useState("all");
  const [status, setStatus] = useState("validado");
  const [from, setFrom] = useState("");
  const [to, setTo] = useState("");

  const filtered = useMemo(() => oc.filter(f => {
    if(status!=="all" && f.status!==status) return false;
    if(sys!=="all" && f.sistema!==sys) return false;
    const txt = ((f.motivo||"")+" "+(f.registrado_por_nome||"")+" "+(f.registrado_por_matricula||"")+" "+(f.observacoes||"")).toLowerCase();
    if(q && !txt.includes(q.toLowerCase())) return false;
    if(from && new Date(f.data_ocorrencia)<new Date(from)) return false;
    if(to && new Date(f.data_ocorrencia)>new Date(to+"T23:59")) return false;
    return true;
  }), [oc, q, sys, status, from, to]);

  const reasonMap = {};
  filtered.filter(f=>f.status==="validado").forEach(f => { reasonMap[f.motivo]=(reasonMap[f.motivo]||0)+1; });
  const ranking = Object.entries(reasonMap).sort((a,b)=>b[1]-a[1]).slice(0,5);

  return (
    <div className="space-y-5">
      <div className="panel p-5">
        <div className="grid grid-cols-1 md:grid-cols-6 gap-3 items-end">
          <div className="md:col-span-2">
            <label>Buscar</label>
            <div className="relative">
              <span className="absolute left-3 top-1/2 -translate-y-1/2" style={{color:"var(--txt-3)"}}>
                <Icon name="search" size={14}/>
              </span>
              <input value={q} onChange={e=>setQ(e.target.value)}
                placeholder="Motivo, operador, matrícula…" style={{paddingLeft:"2.2rem"}}/>
            </div>
          </div>
          <div>
            <label>Sistema</label>
            <select value={sys} onChange={e=>setSys(e.target.value)}>
              <option value="all">Todos</option>
              {Object.entries(SISTEMAS).map(([k,v])=><option key={k} value={k}>{v.name}</option>)}
            </select>
          </div>
          <div>
            <label>Status</label>
            <select value={status} onChange={e=>setStatus(e.target.value)}>
              <option value="validado">Validados</option>
              <option value="pendente">Pendentes</option>
              <option value="rejeitado">Rejeitados</option>
              <option value="all">Todos</option>
            </select>
          </div>
          <div><label>De</label><input type="date" value={from} onChange={e=>setFrom(e.target.value)}/></div>
          <div><label>Até</label><input type="date" value={to} onChange={e=>setTo(e.target.value)}/></div>
        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <div className="panel p-5 lg:col-span-2">
          <div className="flex items-center justify-between mb-4">
            <div>
              <div className="crumb">Resultados</div>
              <div className="font-bold text-lg">{filtered.length} registros encontrados</div>
            </div>
          </div>
          {!filtered.length ? (
            <div className="text-sm py-8 text-center" style={{color:"var(--txt-3)"}}>Nenhum resultado para os filtros aplicados.</div>
          ) : (
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr className="text-left" style={{color:"var(--txt-3)"}}>
                    <th className="py-2 font-semibold">Data</th>
                    <th className="py-2 font-semibold">Sistema</th>
                    <th className="py-2 font-semibold">Motivo</th>
                    <th className="py-2 font-semibold">Status</th>
                    <th className="py-2 font-semibold">Operador</th>
                  </tr>
                </thead>
                <tbody>
                  {filtered.map(f => {
                    const s = SISTEMAS[f.sistema];
                    return (
                      <tr key={f.id} className="table-row border-t" style={{borderColor:"var(--line)"}}>
                        <td className="py-2.5 mono text-xs">{fmtDate(f.data_ocorrencia,true)}</td>
                        <td className="py-2.5">
                          <span className="badge" style={{background:`color-mix(in srgb,${s.accent} 14%,transparent)`,color:s.accent,borderColor:`color-mix(in srgb,${s.accent} 30%,transparent)`}}>
                            <Icon name={s.icon} size={11}/>{s.name}
                          </span>
                        </td>
                        <td className="py-2.5 max-w-[160px]">
                          <div className="truncate">{f.motivo}</div>
                          <div className="mono text-xs" style={{color:"var(--txt-3)"}}>{f.tempo_parada} min</div>
                        </td>
                        <td className="py-2.5"><ValTag status={f.status}/></td>
                        <td className="py-2.5 text-xs" style={{color:"var(--txt-2)"}}>
                          {f.registrado_por_nome}<br/>
                          <span className="mono" style={{color:"var(--txt-3)"}}>mat.{f.registrado_por_matricula}</span>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </div>

        <div className="panel p-5">
          <div className="crumb mb-2">Top 5</div>
          <div className="font-bold text-lg mb-4">Causas mais frequentes</div>
          {!ranking.length ? (
            <div className="text-sm" style={{color:"var(--txt-3)"}}>Sem dados suficientes.</div>
          ) : (
            <div className="space-y-3">
              {ranking.map(([reason,count],i) => {
                const pct = (count/ranking[0][1])*100;
                return (
                  <div key={reason}>
                    <div className="flex justify-between text-sm mb-1">
                      <span className="font-medium truncate pr-2">{i+1}. {reason}</span>
                      <span className="mono font-bold shrink-0">{count}</span>
                    </div>
                    <div className="h-1.5 rounded-full overflow-hidden" style={{background:"var(--bg-3)"}}>
                      <div className="h-full rounded-full" style={{width:`${pct}%`,background:"linear-gradient(90deg,#ff4d6d,#ffb627)"}}/>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   RELATÓRIOS
══════════════════════════════════════════════════════════════ */
function ReportsPage() {
  const { oc, notify } = useApp();
  const [period, setPeriod] = useState("30");
  const [busy, setBusy] = useState(false);

  const generate = async () => {
    setBusy(true);
    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit:"pt", format:"a4" });
      const W = doc.internal.pageSize.getWidth();
      const days = parseInt(period);
      const cutoff = Date.now() - days*864e5;
      const ocVal = oc.filter(o=>o.status==="validado");

      // Header
      doc.setFillColor(15,21,32); doc.rect(0,0,W,80,"F");
      doc.setFillColor(0,217,163); doc.rect(0,80,W,3,"F");
      doc.setTextColor(230,237,247);
      doc.setFont("helvetica","bold"); doc.setFontSize(18);
      doc.text("RELATÓRIO DE UTILIDADES INDUSTRIAIS", 40, 36);
      doc.setFont("helvetica","normal"); doc.setFontSize(10);
      doc.setTextColor(154,167,190);
      doc.text(NOME_EMPRESA, 40, 54);
      doc.text(`Período: últimos ${days} dias  ·  Emitido: ${new Date().toLocaleString("pt-BR")}`, 40, 70);

      let y = 108;

      // 1. Indicadores
      doc.setTextColor(15,23,38); doc.setFont("helvetica","bold"); doc.setFontSize(13);
      doc.text("1. Indicadores de Confiabilidade por Sistema", 40, y); y+=16;
      doc.autoTable({
        startY: y,
        head:[["Sistema","Responsável","Falhas (período)","MTBF","MTTR","Disponibilidade"]],
        body: Object.entries(SISTEMAS).map(([k,m]) => {
          const list = ocVal.filter(o=>o.sistema===k);
          const rec  = list.filter(f=>new Date(f.data_ocorrencia)>cutoff);
          const rel  = reliability(list);
          const val  = VALIDADORES[m.validador];
          return [m.name, val.nome, rec.length, `${rel.mtbf} d`, `${rel.mttr} min`, `${rel.availability}%`];
        }),
        styles:{ font:"helvetica", fontSize:9, cellPadding:5 },
        headStyles:{ fillColor:[29,39,56], textColor:[230,237,247] },
        alternateRowStyles:{ fillColor:[245,247,250] },
        margin:{ left:40, right:40 },
      });
      y = doc.lastAutoTable.finalY + 20;

      // 2. Ocorrências
      if(y>650){ doc.addPage(); y=50; }
      doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(15,23,38);
      doc.text("2. Ocorrências Validadas no Período", 40, y);
      const allFail = ocVal.filter(f=>new Date(f.data_ocorrencia)>cutoff)
        .sort((a,b)=>new Date(b.data_ocorrencia)-new Date(a.data_ocorrencia));
      doc.autoTable({
        startY: y+12,
        head:[["Data/Hora","Sistema","Motivo","Parada (min)","Operador (mat.)"]],
        body: allFail.length
          ? allFail.map(f=>[fmtDate(f.data_ocorrencia,true),SISTEMAS[f.sistema].name,f.motivo,f.tempo_parada,`${f.registrado_por_nome} (${f.registrado_por_matricula})`])
          : [["—","Sem ocorrências no período","","",""]],
        styles:{ font:"helvetica", fontSize:8.5, cellPadding:4.5 },
        headStyles:{ fillColor:[29,39,56], textColor:[230,237,247] },
        margin:{ left:40, right:40 },
      });
      y = doc.lastAutoTable.finalY + 20;

      // 3. Ranking
      if(y>650){ doc.addPage(); y=50; }
      doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(15,23,38);
      doc.text("3. Ranking de Causas Mais Frequentes", 40, y);
      const rm = {};
      allFail.forEach(f => { rm[f.motivo]=(rm[f.motivo]||0)+1; });
      const rank = Object.entries(rm).sort((a,b)=>b[1]-a[1]).slice(0,10);
      doc.autoTable({
        startY: y+12,
        head:[["#","Causa","Ocorrências"]],
        body: rank.length ? rank.map((r,i)=>[i+1,r[0],r[1]]) : [["—","Sem dados",""]],
        styles:{ font:"helvetica", fontSize:9 },
        headStyles:{ fillColor:[29,39,56], textColor:[230,237,247] },
        margin:{ left:40, right:40 },
      });

      // Rodapé
      const total = doc.internal.getNumberOfPages();
      for(let i=1;i<=total;i++){
        doc.setPage(i);
        doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(154,167,190);
        doc.text(`${NOME_EMPRESA} · Relatório de Utilidades · página ${i}/${total}`, 40, 825);
        doc.text(new Date().toLocaleString("pt-BR"), W-40, 825, {align:"right"});
      }

      doc.save(`relatorio-utilidades-${todayISO()}.pdf`);
      notify("Relatório PDF gerado!");
    } catch(e) {
      console.error(e);
      notify("Erro ao gerar PDF: "+e.message, "err");
    } finally {
      setBusy(false);
    }
  };

  const exportXls = () => {
    const wb = XLSX.utils.book_new();
    const ocVal = oc.filter(o=>o.status==="validado");
    Object.entries(SISTEMAS).forEach(([k,m]) => {
      const rows = ocVal.filter(o=>o.sistema===k).map(f=>({
        "Data/Hora": fmtDate(f.data_ocorrencia,true),
        "Motivo": f.motivo,
        "Parada (min)": f.tempo_parada,
        "Observações": f.observacoes||"",
        "Operador": f.registrado_por_nome,
        "Matrícula": f.registrado_por_matricula,
        "E-mail": f.registrado_por_email,
      }));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), m.name.slice(0,30));
    });
    XLSX.writeFile(wb, `dados-utilidades-${todayISO()}.xlsx`);
    notify("Excel exportado!");
  };

  return (
    <div className="space-y-5">
      <div className="panel p-6">
        <div className="crumb mb-1">Centro de relatórios</div>
        <h2 className="text-2xl font-extrabold mb-2">Relatórios profissionais</h2>
        <p className="text-sm mb-5" style={{color:"var(--txt-2)"}}>
          Apenas registros <strong>validados</strong> pelos gerentes setoriais são incluídos. O PDF contém indicadores por sistema, ocorrências, ranking de causas e capa corporativa com paginação automática.
        </p>
        <div className="flex flex-wrap gap-3 items-end">
          <div>
            <label>Período</label>
            <select value={period} onChange={e=>setPeriod(e.target.value)} style={{width:210}}>
              <option value="7">Últimos 7 dias</option>
              <option value="30">Últimos 30 dias</option>
              <option value="60">Últimos 60 dias</option>
              <option value="90">Últimos 90 dias</option>
              <option value="180">Últimos 6 meses</option>
              <option value="365">Últimos 12 meses</option>
            </select>
          </div>
          <button className="btn btn-primary" onClick={generate} disabled={busy}>
            {busy ? <><span className="spinner"/> Gerando…</> : <><Icon name="report" size={15}/>Gerar PDF</>}
          </button>
          <button className="btn" onClick={exportXls}>
            <Icon name="download" size={15}/>Exportar Excel
          </button>
        </div>
      </div>

      {/* Validadores info */}
      <div className="panel p-5">
        <div className="crumb mb-3">Estrutura de validação</div>
        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
          {Object.entries(VALIDADORES).map(([k,v]) => {
            const sistemas = Object.entries(SISTEMAS).filter(([,s])=>s.validador===k);
            return (
              <div key={k} className="panel-flat p-4">
                <div className="font-bold">{v.nome}</div>
                <div className="text-xs mb-3" style={{color:"var(--txt-3)"}}>{v.cargo} · {v.email}</div>
                <div className="space-y-1.5">
                  {sistemas.map(([sk,sm]) => (
                    <div key={sk} className="flex items-center gap-2 text-xs">
                      <span style={{color:sm.accent}}><Icon name={sm.icon} size={12}/></span>
                      <span>{sm.name}</span>
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
        <div className="mt-4 panel-flat p-4 flex items-start gap-3">
          <div className="w-9 h-9 rounded-lg flex items-center justify-center shrink-0"
            style={{background:"rgba(79,179,255,.14)",color:"#4fb3ff"}}>
            <Icon name="info"/>
          </div>
          <div>
            <div className="font-semibold text-sm">Gerente Geral — {GERENTE_GERAL.nome}</div>
            <div className="text-xs mt-0.5" style={{color:"var(--txt-3)"}}>
              {GERENTE_GERAL.email} · Recebe cópia automática de <strong>todas</strong> as ocorrências validadas pelos gerentes setoriais.
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   CONFIGURAÇÕES
══════════════════════════════════════════════════════════════ */
function SettingsPage() {
  const { user, theme, setTheme, isAnyValidador, meusSistemas, adminAuth, verifyAdmin, lockAdmin, adminDelete, adminResetAll, adminBackupPDF, oc, notify } = useApp();
  const userVal = Object.values(VALIDADORES).find(v=>v.email.toLowerCase()===user.email.toLowerCase());

  /* Admin states */
  const [showAdminLogin, setShowAdminLogin] = useState(false);
  const [adminPwd, setAdminPwd] = useState("");
  const [showResetConfirm, setShowResetConfirm] = useState(false);
  const [resetConfirmText, setResetConfirmText] = useState("");
  const [showDeleteModal, setShowDeleteModal] = useState(false);
  const [deleteTarget, setDeleteTarget] = useState(null);
  const [deleteConfirmText, setDeleteConfirmText] = useState("");
  const [searchId, setSearchId] = useState("");
  const [busyReset, setBusyReset] = useState(false);
  const [busyDel, setBusyDel] = useState(false);

  const handleAdminLogin = (e) => {
    e.preventDefault();
    if(verifyAdmin(adminPwd)) {
      notify("Acesso administrativo liberado.");
      setShowAdminLogin(false);
      setAdminPwd("");
    } else {
      notify("Senha incorreta.", "err");
      setAdminPwd("");
    }
  };

  const handleResetAll = async () => {
    if(resetConfirmText !== "CONFIRMAR") { notify("Digite CONFIRMAR para prosseguir.", "err"); return; }
    setBusyReset(true);
    await adminResetAll();
    setBusyReset(false);
    setShowResetConfirm(false);
    setResetConfirmText("");
  };

  const foundOc = searchId ? oc.find(o => String(o.id) === searchId.replace("#","").trim()) : null;

  const handleDelete = async () => {
    if(deleteConfirmText !== "CONFIRMAR") { notify("Digite CONFIRMAR para prosseguir.", "err"); return; }
    if(!deleteTarget) return;
    setBusyDel(true);
    await adminDelete(deleteTarget);
    setBusyDel(false);
    setShowDeleteModal(false);
    setDeleteTarget(null);
    setDeleteConfirmText("");
    setSearchId("");
  };

  return (
    <div className="space-y-5">
      {/* Identificação */}
      <div className="panel p-6">
        <div className="crumb mb-1">Operador</div>
        <div className="font-bold text-lg mb-3">Sua identificação nesta sessão</div>
        <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div className="panel-flat p-3"><div className="crumb">Nome</div><div className="font-semibold mt-1">{user.nome}</div></div>
          <div className="panel-flat p-3"><div className="crumb">Matrícula</div><div className="font-semibold mono mt-1">{user.matricula}</div></div>
          <div className="panel-flat p-3"><div className="crumb">E-mail</div><div className="font-semibold mt-1 text-sm break-all">{user.email}</div></div>
        </div>
        {isAnyValidador && (
          <div className="mt-3 panel-flat p-3 text-sm flex items-start gap-2" style={{color:"#a78bfa"}}>
            <Icon name="shield" size={15} className="shrink-0 mt-0.5"/>
            <div>
              Você é <strong>VALIDADOR</strong> ({userVal?.cargo}). Pode validar/rejeitar ocorrências dos sistemas:
              <span className="font-semibold"> {meusSistemas.map(k=>SISTEMAS[k].name).join(", ")}</span>.
            </div>
          </div>
        )}
        {adminAuth && (
          <div className="mt-3 panel-flat p-3 text-sm flex items-center justify-between" style={{color:"#ff4d6d",borderColor:"rgba(255,77,109,.4)"}}>
            <div className="flex items-center gap-2"><Icon name="shield" size={15}/><strong>MODO ADMINISTRADOR ATIVO</strong></div>
            <button className="btn btn-ghost text-xs" onClick={lockAdmin} style={{color:"#ff4d6d"}}>
              <Icon name="lock" size={13}/>Bloquear
            </button>
          </div>
        )}
      </div>

      {/* Tema */}
      <div className="panel p-6">
        <div className="crumb mb-1">Aparência</div>
        <div className="font-bold text-lg mb-4">Tema do painel</div>
        <div className="grid grid-cols-2 gap-3 max-w-sm">
          <button className={`panel-flat p-4 text-left transition-all ${theme==="dark"?"border-[#00d9a3]":""}`}
            onClick={()=>setTheme("dark")}>
            <div className="flex items-center gap-2 mb-1"><Icon name="moon"/><span className="font-bold">Escuro</span></div>
            <div className="text-xs" style={{color:"var(--txt-3)"}}>Centro de controle</div>
          </button>
          <button className={`panel-flat p-4 text-left transition-all ${theme==="light"?"border-[#00d9a3]":""}`}
            onClick={()=>setTheme("light")}>
            <div className="flex items-center gap-2 mb-1"><Icon name="sun"/><span className="font-bold">Claro</span></div>
            <div className="text-xs" style={{color:"var(--txt-3)"}}>Ambiente office</div>
          </button>
        </div>
      </div>

      {/* Fluxo */}
      <div className="panel p-6">
        <div className="crumb mb-1">Fluxo de validação</div>
        <div className="font-bold text-lg mb-3">Como funciona o sistema</div>
        <ol className="space-y-3 text-sm" style={{color:"var(--txt-2)"}}>
          {[
            "Operador se identifica com nome, matrícula e e-mail ao acessar o painel.",
            "Ao registrar uma ocorrência, o e-mail do operador abre com mensagem pré-preenchida para o gerente setorial responsável pelo sistema.",
            "O registro fica com status PENDENTE — não aparece em KPIs, gráficos nem histórico.",
            "O gerente setorial acessa a aba 'Pendentes' e pode Validar ou Rejeitar. Cada gerente só age nos seus sistemas.",
            "Ao VALIDAR: e-mail automático vai para o Gerente Geral Cícero Sabino Leite como informativo.",
            "Ao REJEITAR: e-mail automático vai para o operador com o motivo dos ajustes necessários.",
            "Apenas registros VALIDADOS entram nos KPIs, gráficos, histórico e relatórios PDF.",
          ].map((s,i)=>(
            <li key={i} className="flex gap-3">
              <span className="mono font-bold shrink-0 w-5" style={{color:"#00d9a3"}}>0{i+1}</span>
              <span>{s}</span>
            </li>
          ))}
        </ol>
      </div>

      {/* ══════ ZONA DE ADMINISTRAÇÃO ══════ */}
      <div className="panel p-6" style={{borderColor:"rgba(255,77,109,.3)"}}>
        <div className="flex items-center gap-2 mb-1">
          <span style={{color:"#ff4d6d"}}><Icon name="alert" size={18}/></span>
          <div className="crumb" style={{color:"#ff4d6d"}}>Zona de administração</div>
        </div>
        <div className="font-bold text-lg mb-2">Ações administrativas</div>
        <p className="text-sm mb-4" style={{color:"var(--txt-3)"}}>
          Ações irreversíveis de exclusão e reset de dados. Requerem autenticação com senha de administrador.
          Todas as ações geram notificação por e-mail aos gerentes setoriais e ao Gerente Geral.
        </p>

        {!adminAuth ? (
          /* Login admin */
          <div>
            {!showAdminLogin ? (
              <button className="btn btn-danger" onClick={()=>setShowAdminLogin(true)}>
                <Icon name="lock" size={14}/>Autenticar como administrador
              </button>
            ) : (
              <form onSubmit={handleAdminLogin} className="panel-flat p-4 max-w-sm space-y-3">
                <div className="text-sm font-semibold" style={{color:"#ff4d6d"}}>Digite a senha de administrador</div>
                <input type="password" value={adminPwd} onChange={e=>setAdminPwd(e.target.value)}
                  placeholder="Senha master" autoFocus />
                <div className="flex gap-2">
                  <button type="submit" className="btn btn-danger"><Icon name="shield" size={14}/>Entrar</button>
                  <button type="button" className="btn" onClick={()=>{setShowAdminLogin(false);setAdminPwd("");}}>Cancelar</button>
                </div>
              </form>
            )}
          </div>
        ) : (
          /* Painel admin desbloqueado */
          <div className="space-y-5">

            {/* Excluir ocorrência */}
            <div className="panel-flat p-5" style={{borderColor:"rgba(255,182,39,.35)"}}>
              <div className="flex items-center gap-2 mb-2">
                <span style={{color:"#ffb627"}}><Icon name="trash" size={16}/></span>
                <div className="font-bold">Excluir ocorrência específica</div>
              </div>
              <p className="text-xs mb-3" style={{color:"var(--txt-3)"}}>
                Busque pelo ID da ocorrência para excluí-la permanentemente.
                O gerente setorial responsável e o Gerente Geral serão notificados por e-mail.
              </p>
              <div className="flex gap-2 items-end max-w-md">
                <div className="flex-1">
                  <label>ID da ocorrência</label>
                  <input value={searchId} onChange={e=>setSearchId(e.target.value)}
                    placeholder="Ex: 42" type="text" />
                </div>
                <button className="btn" disabled={!searchId}
                  onClick={()=>{if(foundOc){setDeleteTarget(foundOc);setShowDeleteModal(true);setDeleteConfirmText("");}else{notify("ID #"+searchId.replace("#","")+" não encontrado.","err");}}}>
                  <Icon name="search" size={14}/>Buscar
                </button>
              </div>
              {searchId && foundOc && (
                <div className="mt-3 panel-flat p-3 text-sm">
                  <div className="flex items-center gap-2 flex-wrap mb-1">
                    <span className="badge" style={{background:`color-mix(in srgb,${SISTEMAS[foundOc.sistema]?.accent||"#999"} 14%,transparent)`,color:SISTEMAS[foundOc.sistema]?.accent||"#999"}}>
                      <Icon name={SISTEMAS[foundOc.sistema]?.icon||"alert"} size={11}/>{SISTEMAS[foundOc.sistema]?.name||foundOc.sistema}
                    </span>
                    <ValTag status={foundOc.status}/>
                    <span className="mono text-xs" style={{color:"var(--txt-3)"}}>ID #{foundOc.id}</span>
                  </div>
                  <div className="font-semibold">{foundOc.motivo}</div>
                  <div className="text-xs mt-1" style={{color:"var(--txt-3)"}}>
                    {fmtDate(foundOc.data_ocorrencia,true)} · Parada: {foundOc.tempo_parada} min
                    · Por: {foundOc.registrado_por_nome} (mat.{foundOc.registrado_por_matricula})
                  </div>
                  <button className="btn btn-danger mt-3" onClick={()=>{setDeleteTarget(foundOc);setShowDeleteModal(true);setDeleteConfirmText("");}}>
                    <Icon name="trash" size={14}/>Excluir este registro
                  </button>
                </div>
              )}
              {searchId && !foundOc && (
                <div className="mt-2 text-xs" style={{color:"var(--txt-3)"}}>Nenhum registro encontrado com ID #{searchId.replace("#","")}</div>
              )}
            </div>

            {/* Zerar tudo */}
            <div className="panel-flat p-5" style={{borderColor:"rgba(255,77,109,.4)"}}>
              <div className="flex items-center gap-2 mb-2">
                <span style={{color:"#ff4d6d"}}><Icon name="alert" size={16}/></span>
                <div className="font-bold" style={{color:"#ff4d6d"}}>Zerar todos os indicadores</div>
              </div>
              <p className="text-xs mb-3" style={{color:"var(--txt-3)"}}>
                Remove permanentemente TODAS as {oc.length} ocorrências do banco de dados.
                Todos os indicadores (MTBF, MTTR, disponibilidade, dias sem falha) serão reiniciados.
                Um PDF de backup será gerado automaticamente antes da exclusão.
                Todos os gerentes serão notificados por e-mail.
              </p>
              <div className="flex gap-2">
                <button className="btn btn-danger" onClick={()=>{setShowResetConfirm(true);setResetConfirmText("");}}>
                  <Icon name="alert" size={14}/>Zerar tudo ({oc.length} registros)
                </button>
                <button className="btn" onClick={adminBackupPDF}>
                  <Icon name="download" size={14}/>Gerar backup PDF agora
                </button>
              </div>
            </div>
          </div>
        )}
      </div>

      {/* ══════ MODAL: Confirmar exclusão ══════ */}
      {showDeleteModal && deleteTarget && (
        <div className="modal-backdrop" onClick={()=>setShowDeleteModal(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()} style={{borderColor:"rgba(255,77,109,.4)"}}>
            <div className="flex items-start justify-between mb-4">
              <div>
                <div className="crumb" style={{color:"#ff4d6d"}}>Exclusão permanente</div>
                <h2 className="text-xl font-bold mt-1 flex items-center gap-2">
                  <span style={{color:"#ff4d6d"}}><Icon name="trash"/></span>
                  Excluir ocorrência #{deleteTarget.id}
                </h2>
              </div>
              <button onClick={()=>setShowDeleteModal(false)} className="btn btn-ghost p-1.5"><Icon name="x" size={18}/></button>
            </div>

            <div className="panel-flat p-3 mb-4 text-sm">
              <div className="font-semibold">{SISTEMAS[deleteTarget.sistema]?.name} — {deleteTarget.motivo}</div>
              <div className="text-xs mt-1" style={{color:"var(--txt-3)"}}>
                {fmtDate(deleteTarget.data_ocorrencia,true)} · {deleteTarget.tempo_parada} min
                · {deleteTarget.registrado_por_nome} (mat.{deleteTarget.registrado_por_matricula})
                · Status: {deleteTarget.status}
              </div>
            </div>

            <div className="panel-flat p-3 mb-4 text-xs flex items-start gap-2" style={{color:"#ff4d6d",borderColor:"rgba(255,77,109,.4)"}}>
              <Icon name="alert" size={14} className="shrink-0 mt-0.5"/>
              <div>
                <strong>ATENÇÃO:</strong> Esta ação é irreversível. O registro será excluído permanentemente do banco de dados.
                O Gerente Setorial ({getValidador(deleteTarget.sistema).nome}) e o Gerente Geral ({GERENTE_GERAL.nome}) serão notificados por e-mail.
              </div>
            </div>

            <div className="mb-4">
              <label style={{color:"#ff4d6d"}}>Digite CONFIRMAR para prosseguir</label>
              <input value={deleteConfirmText} onChange={e=>setDeleteConfirmText(e.target.value)}
                placeholder="CONFIRMAR" autoFocus style={{borderColor:"rgba(255,77,109,.4)"}}/>
            </div>

            <div className="flex justify-end gap-2">
              <button className="btn" onClick={()=>setShowDeleteModal(false)}>Cancelar</button>
              <button className="btn btn-danger" disabled={deleteConfirmText!=="CONFIRMAR"||busyDel} onClick={handleDelete}>
                {busyDel?<><span className="spinner"/> Excluindo…</>:<><Icon name="trash" size={14}/>Excluir permanentemente</>}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ══════ MODAL: Confirmar reset total ══════ */}
      {showResetConfirm && (
        <div className="modal-backdrop" onClick={()=>setShowResetConfirm(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()} style={{borderColor:"rgba(255,77,109,.5)"}}>
            <div className="flex items-start justify-between mb-4">
              <div>
                <div className="crumb" style={{color:"#ff4d6d"}}>RESET TOTAL</div>
                <h2 className="text-xl font-bold mt-1 flex items-center gap-2">
                  <span style={{color:"#ff4d6d"}}><Icon name="alert"/></span>
                  Zerar todos os indicadores
                </h2>
              </div>
              <button onClick={()=>setShowResetConfirm(false)} className="btn btn-ghost p-1.5"><Icon name="x" size={18}/></button>
            </div>

            <div className="panel-flat p-3 mb-4 text-sm" style={{borderColor:"rgba(255,77,109,.4)"}}>
              <div className="text-center py-3">
                <div className="mono font-extrabold text-4xl" style={{color:"#ff4d6d"}}>{oc.length}</div>
                <div className="text-xs mt-1" style={{color:"var(--txt-3)"}}>registros serão excluídos permanentemente</div>
              </div>
            </div>

            <div className="panel-flat p-3 mb-4 text-xs flex items-start gap-2" style={{color:"#ff4d6d",borderColor:"rgba(255,77,109,.4)"}}>
              <Icon name="alert" size={14} className="shrink-0 mt-0.5"/>
              <div>
                <strong>ATENÇÃO MÁXIMA:</strong> Esta ação excluirá TODOS os registros de ocorrências (validados, pendentes e rejeitados).
                Todos os indicadores serão zerados. Um backup em PDF será gerado automaticamente antes da exclusão.
                Todos os gerentes setoriais e o Gerente Geral serão notificados.
              </div>
            </div>

            <div className="panel-flat p-3 mb-4 text-xs flex items-start gap-2" style={{color:"#00d9a3"}}>
              <Icon name="check" size={14} className="shrink-0 mt-0.5"/>
              <span>Um PDF com todos os dados será salvo automaticamente no seu computador antes da exclusão.</span>
            </div>

            <div className="mb-4">
              <label style={{color:"#ff4d6d"}}>Digite CONFIRMAR para prosseguir com o reset total</label>
              <input value={resetConfirmText} onChange={e=>setResetConfirmText(e.target.value)}
                placeholder="CONFIRMAR" autoFocus style={{borderColor:"rgba(255,77,109,.4)"}}/>
            </div>

            <div className="flex justify-end gap-2">
              <button className="btn" onClick={()=>setShowResetConfirm(false)}>Cancelar</button>
              <button className="btn btn-danger" disabled={resetConfirmText!=="CONFIRMAR"||busyReset} onClick={handleResetAll}>
                {busyReset?<><span className="spinner"/> Gerando backup e zerando…</>:<><Icon name="alert" size={14}/>Confirmar Reset Total</>}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   SHELL + APP ROOT
══════════════════════════════════════════════════════════════ */
function Shell() {
  const { user } = useApp();
  const [active, setActive] = useState("home");
  const [mob, setMob] = useState(false);

  if(!user) return <LoginScreen/>;

  const render = () => {
    switch(active) {
      case "home":         return <HomePage/>;
      case "termico":
      case "eletrica":
      case "refrigeracao":
      case "arComprimido":
      case "etdi":
      case "u2110":
      case "u2111":
      case "te":           return <SysPage sysKey={active}/>;
      case "pending":      return <PendingPage/>;
      case "history":      return <HistoryPage/>;
      case "reports":      return <ReportsPage/>;
      case "settings":     return <SettingsPage/>;
      default:             return <HomePage/>;
    }
  };

  return (
    <div className="flex h-screen">
      <Sidebar active={active} setActive={setActive}/>
      {mob && (
        <>
          <div className="mobile-overlay lg:hidden" onClick={()=>setMob(false)}/>
          <div className="lg:hidden fixed left-0 top-0 z-50 h-full">
            <Sidebar mobile active={active} setActive={setActive} close={()=>setMob(false)}/>
          </div>
        </>
      )}
      <main className="flex-1 flex flex-col h-screen overflow-hidden grid-bg">
        <TopBar active={active} openMobile={()=>setMob(true)}/>
        <div className="flex-1 overflow-y-auto p-4 lg:p-7">
          <div className="max-w-[1600px] mx-auto">
            {render()}
          </div>
        </div>
      </main>
    </div>
  );
}

function App() { return <Provider><Shell/></Provider>; }
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
