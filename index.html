<style>
:root{
  --bg-0:#0a0e14;--bg-1:#0f1520;--bg-2:#161e2c;--bg-3:#1d2738;
  --line:#243047;--line-2:#2d3a55;
  --txt-1:#e6edf7;--txt-2:#9aa7be;--txt-3:#5a6885;
  --acc:#00d9a3;--acc-2:#ffb627;--acc-3:#ff4d6d;--acc-4:#4fb3ff;--acc-5:#a78bfa;--acc-6:#34d399;
  --grid:rgba(255,255,255,.04);
}
html.light{
  --bg-0:#f4f6fa;--bg-1:#ffffff;--bg-2:#ffffff;--bg-3:#f0f3f8;
  --line:#dde3ee;--line-2:#c8d1e0;
  --txt-1:#0f1726;--txt-2:#4a5775;--txt-3:#7c8aa8;
  --grid:rgba(0,0,0,.04);
}
*{-webkit-font-smoothing:antialiased;box-sizing:border-box;}
html,body,#root{height:100%;margin:0;padding:0;}
body{background:var(--bg-0);color:var(--txt-1);font-family:'Manrope',system-ui,sans-serif;overflow-x:hidden;}
.mono{font-family:'JetBrains Mono',monospace;font-feature-settings:"tnum" 1;}
.grid-bg{
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;
}
.panel{background:var(--bg-1);border:1px solid var(--line);border-radius:14px;}
html.light .panel{box-shadow:0 1px 2px rgba(15,23,38,.04),0 4px 16px rgba(15,23,38,.04);}
.panel-flat{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;}
.btn{
  display:inline-flex;align-items:center;gap:.5rem;
  padding:.55rem .9rem;border-radius:10px;
  font-weight:600;font-size:.85rem;
  border:1px solid var(--line-2);background:var(--bg-2);color:var(--txt-1);
  transition:transform .12s,background .12s,border-color .12s;cursor:pointer;
  font-family:'Manrope',sans-serif;
}
.btn:hover{transform:translateY(-1px);border-color:var(--txt-3);}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
.btn-primary{background:var(--acc);color:#04140e;border-color:transparent;}
.btn-primary:hover{filter:brightness(1.06);}
.btn-danger{background:var(--acc-3);color:#fff;border-color:transparent;}
.btn-warn{background:var(--acc-2);color:#3a2900;border-color:transparent;}
.btn-ghost{background:transparent;border-color:transparent;}
.badge{
  display:inline-flex;align-items:center;gap:.35rem;
  padding:.2rem .55rem;border-radius:999px;
  font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  border:1px solid var(--line-2);background:var(--bg-2);color:var(--txt-2);
}
.pulse-dot{width:8px;height:8px;border-radius:50%;animation:pulse 1.8s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,217,163,.6);}70%{box-shadow:0 0 0 10px rgba(0,217,163,0);}100%{box-shadow:0 0 0 0 rgba(0,217,163,0);}}
input,select,textarea{
  background:var(--bg-2);color:var(--txt-1);
  border:1px solid var(--line-2);border-radius:10px;
  padding:.55rem .75rem;font-size:.9rem;font-family:'Manrope',sans-serif;
  width:100%;outline:none;transition:border-color .15s,box-shadow .15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(0,217,163,.18);}
label{font-size:.72rem;font-weight:600;color:var(--txt-2);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:.35rem;}
.nav-item{
  display:flex;align-items:center;gap:.75rem;
  padding:.65rem .85rem;border-radius:10px;
  color:var(--txt-2);font-weight:500;cursor:pointer;
  border:1px solid transparent;transition:all .12s;font-size:.88rem;
}
.nav-item:hover{background:var(--bg-2);color:var(--txt-1);}
.nav-item.active{background:linear-gradient(135deg,rgba(0,217,163,.12),rgba(79,179,255,.06));color:var(--txt-1);border-color:rgba(0,217,163,.35);}
.nav-item.active .nav-icon{color:var(--acc);}
.stat-card{
  position:relative;overflow:hidden;
  background:linear-gradient(180deg,var(--bg-1),var(--bg-2));
  border:1px solid var(--line);border-radius:16px;padding:1.25rem;
  transition:border-color .2s,transform .2s;
}
.stat-card:hover{border-color:var(--line-2);}
.accent-line{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:var(--txt-3);}
.modal-backdrop{
  position:fixed;inset:0;z-index:50;
  background:rgba(5,8,14,.75);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;
  padding:1rem;animation:fadeIn .15s ease;
}
.modal{
  width:100%;max-width:560px;
  background:var(--bg-1);border:1px solid var(--line-2);
  border-radius:16px;padding:1.5rem;
  max-height:90vh;overflow-y:auto;animation:pop .18s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.reveal{animation:rise .35s ease both;}
@keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.table-row:hover{background:var(--bg-3);}
.ring-track{stroke:var(--line);}
.ring-fill{transition:stroke-dashoffset .8s ease;}
.toast{
  position:fixed;bottom:1.25rem;right:1.25rem;z-index:60;
  background:var(--bg-1);border:1px solid var(--line-2);
  border-radius:12px;padding:.85rem 1rem;font-size:.85rem;
  display:flex;align-items:center;gap:.6rem;
  animation:rise .25s ease;box-shadow:0 10px 30px rgba(0,0,0,.4);
  max-width:420px;
}
.crumb{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--txt-3);letter-spacing:.18em;text-transform:uppercase;}
h1.title{font-family:'Manrope';font-weight:800;letter-spacing:-.02em;font-size:1.6rem;line-height:1.05;}
@media(min-width:768px){h1.title{font-size:1.9rem;}}
.tag-green{background:rgba(0,217,163,.12);color:var(--acc);border:1px solid rgba(0,217,163,.3);}
.tag-amber{background:rgba(255,182,39,.12);color:var(--acc-2);border:1px solid rgba(255,182,39,.3);}
.tag-red{background:rgba(255,77,109,.12);color:var(--acc-3);border:1px solid rgba(255,77,109,.3);}
.tag-blue{background:rgba(79,179,255,.12);color:var(--acc-4);border:1px solid rgba(79,179,255,.3);}
.tag-violet{background:rgba(167,139,250,.12);color:var(--acc-5);border:1px solid rgba(167,139,250,.3);}
.tag-teal{background:rgba(52,211,153,.12);color:var(--acc-6);border:1px solid rgba(52,211,153,.3);}
.mobile-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;}
.login-bg{
  position:fixed;inset:0;
  background:radial-gradient(circle at 20% 30%,rgba(0,217,163,.15),transparent 40%),
    radial-gradient(circle at 80% 70%,rgba(79,179,255,.12),transparent 45%),var(--bg-0);
}
.login-bg::before{
  content:"";position:absolute;inset:0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:40px 40px;
  mask-image:radial-gradient(ellipse at center,black 30%,transparent 70%);
}
.login-card{
  position:relative;z-index:2;width:100%;max-width:440px;
  background:var(--bg-1);border:1px solid var(--line-2);
  border-radius:18px;padding:2rem;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
}
.spinner{
  width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;
  border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle;
}
@keyframes spin{to{transform:rotate(360deg)}}
.scanlines::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px);
  border-radius:inherit;
}
</style>

/* ══════════════════════════════════════════════════════════════
   UTILS
══════════════════════════════════════════════════════════════ */
const fmtDate = (iso, withTime=false) => {
  if(!iso) return "—";
  return new Date(iso).toLocaleString("pt-BR", withTime
    ? {day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}
    : {day:"2-digit",month:"2-digit",year:"numeric"});
};
const todayISO = () => new Date().toISOString().slice(0,10);
const daysSince = iso => iso ? Math.floor((Date.now()-new Date(iso).getTime())/(864e5)) : null;
const fmtNum = (n,d=2) => Number(n||0).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtMoney = n => Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});

const reliability = history => {
  if(!history?.length) return {mtbf:"∞",mttr:"0",availability:"100.00",count:0};
  const totalDown = history.reduce((s,f)=>s+(+f.tempo_parada||0),0);
  const mttr = totalDown/history.length;
  const sorted = [...history].sort((a,b)=>new Date(a.data_ocorrencia)-new Date(b.data_ocorrencia));
  let mtbf = 0;
  if(sorted.length>=2){
    const span=(new Date(sorted[sorted.length-1].data_ocorrencia)-new Date(sorted[0].data_ocorrencia))/864e5;
    mtbf=span/Math.max(1,sorted.length-1);
  } else {
    mtbf=daysSince(sorted[0]?.data_ocorrencia)||0;
  }
  const cutoff = Date.now()-30*864e5;
  const recent = history.filter(f=>new Date(f.data_ocorrencia)>cutoff);
  const downMin = recent.reduce((s,f)=>s+(+f.tempo_parada||0),0);
  const availability = Math.max(0,Math.min(100,100-(downMin/(30*24*60))*100));
  return {
    mtbf: typeof mtbf==="number" ? mtbf.toFixed(1) : mtbf,
    mttr: mttr.toFixed(0),
    availability: availability.toFixed(2),
    count: history.length,
  };
};

/* ══════════════════════════════════════════════════════════════
   CONTEXT
══════════════════════════════════════════════════════════════ */
const Ctx = createContext(null);
const useApp = () => useContext(Ctx);

function Provider({ children }) {
  const [user, setUser] = useState(() => {
    try { return JSON.parse(localStorage.getItem("ream-user-v3")||"null"); } catch { return null; }
  });
  const [theme, setThemeState] = useState(() => localStorage.getItem("ream-theme")||"dark");
  const [toast, setToast] = useState(null);
  const [oc, setOc] = useState([]);
  const [loading, setLoading] = useState(false);

  useEffect(() => {
    document.documentElement.classList.toggle("light", theme==="light");
    localStorage.setItem("ream-theme", theme);
  }, [theme]);

  const notify = useCallback((msg, kind="ok") => {
    setToast({ msg, kind });
    setTimeout(() => setToast(null), 3800);
  }, []);

  const fetchData = useCallback(async () => {
    if(!db || !user) return;
    setLoading(true);
    try {
      const { data, error } = await db.from("ocorrencias").select("*").order("data_ocorrencia", { ascending: false });
      if(error) throw error;
      setOc(data || []);
    } catch(e) {
      notify("Erro ao carregar dados: " + e.message, "err");
    } finally {
      setLoading(false);
    }
  }, [user, notify]);

  useEffect(() => { if(user) fetchData(); }, [user]);

  const login = useCallback(u => {
    localStorage.setItem("ream-user-v3", JSON.stringify(u));
    setUser(u);
  }, []);

  const logout = useCallback(() => {
    localStorage.removeItem("ream-user-v3");
    setUser(null);
    setOc([]);
  }, []);

  const setTheme = useCallback(t => setThemeState(t), []);

  /* Determina papel do usuário */
  const userEmail = user?.email?.toLowerCase() || "";
  const isValidadorBruno   = userEmail === VALIDADORES.bruno.email.toLowerCase();
  const isValidadorAlfredo = userEmail === VALIDADORES.alfredo.email.toLowerCase();
  const isValidadorPaulo   = userEmail === VALIDADORES.paulo.email.toLowerCase();
  const isAnyValidador     = isValidadorBruno || isValidadorAlfredo || isValidadorPaulo;
  const isGerenteGeral     = userEmail === GERENTE_GERAL.email.toLowerCase();

  /* Quais sistemas este usuário pode validar */
  const meusSistemas = useMemo(() => {
    if(isValidadorBruno)   return Object.keys(SISTEMAS).filter(k=>SISTEMAS[k].validador==="bruno");
    if(isValidadorAlfredo) return Object.keys(SISTEMAS).filter(k=>SISTEMAS[k].validador==="alfredo");
    if(isValidadorPaulo)   return Object.keys(SISTEMAS).filter(k=>SISTEMAS[k].validador==="paulo");
    return [];
  }, [isValidadorBruno, isValidadorAlfredo, isValidadorPaulo]);

  /* Admin state */
  const [adminAuth, setAdminAuth] = useState(false);
  const verifyAdmin = useCallback((pwd) => {
    if(pwd === ADMIN_PASSWORD) { setAdminAuth(true); return true; }
    return false;
  }, []);
  const lockAdmin = useCallback(() => setAdminAuth(false), []);

  /* Admin: excluir uma ocorrência */
  const adminDelete = useCallback(async (item) => {
    if(!db || !adminAuth) return false;
    try {
      const { error } = await db.from("ocorrencias").delete().eq("id", item.id);
      if(error) throw error;
      notify("Registro #" + item.id + " excluído permanentemente.", "info");
      setTimeout(() => openEmail(buildEmailExclusao(item, user.nome)), 900);
      await fetchData();
      return true;
    } catch(e) { notify("Erro ao excluir: " + e.message, "err"); return false; }
  }, [adminAuth, user, fetchData, notify]);

  /* Admin: gerar PDF backup antes de zerar */
  const adminBackupPDF = useCallback(() => {
    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit:"pt", format:"a4" });
      const W = doc.internal.pageSize.getWidth();
      doc.setFillColor(15,21,32); doc.rect(0,0,W,80,"F");
      doc.setFillColor(0,166,118); doc.rect(0,80,W,3,"F");
      doc.setTextColor(230,237,247);
      doc.setFont("helvetica","bold"); doc.setFontSize(18);
      doc.text("BACKUP COMPLETO — ANTES DO RESET", 40, 36);
      doc.setFont("helvetica","normal"); doc.setFontSize(10);
      doc.setTextColor(154,167,190);
      doc.text(NOME_EMPRESA, 40, 54);
      doc.text("Gerado em: " + new Date().toLocaleString("pt-BR") + "  ·  Por: " + user.nome, 40, 70);
      let y = 108;
      doc.setTextColor(15,23,38); doc.setFont("helvetica","bold"); doc.setFontSize(13);
      doc.text("Todas as ocorrências do sistema (" + oc.length + " registros)", 40, y);
      doc.autoTable({
        startY: y+14,
        head:[["ID","Data","Sistema","Motivo","Parada","Status","Operador"]],
        body: oc.map(o => [
          "#"+o.id,
          fmtDate(o.data_ocorrencia,true),
          SISTEMAS[o.sistema]?.name||o.sistema,
          o.motivo,
          o.tempo_parada+" min",
          o.status,
          o.registrado_por_nome+" ("+o.registrado_por_matricula+")"
        ]),
        styles:{ font:"helvetica", fontSize:7.5, cellPadding:4 },
        headStyles:{ fillColor:[15,21,32], textColor:[230,237,247] },
        alternateRowStyles:{ fillColor:[244,246,250] },
        margin:{ left:40, right:40 },
      });
      // Resumo por sistema
      const lastY = doc.lastAutoTable.finalY + 24;
      if(lastY > 700) { doc.addPage(); }
      const summaryY = lastY > 700 ? 50 : lastY;
      doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(15,23,38);
      doc.text("Resumo por sistema", 40, summaryY);
      const ocVal = oc.filter(o=>o.status==="validado");
      doc.autoTable({
        startY: summaryY+14,
        head:[["Sistema","Total","Validados","Pendentes","Rejeitados","MTBF","MTTR","Disponib."]],
        body: Object.entries(SISTEMAS).map(([k,m])=>{
          const all=oc.filter(o=>o.sistema===k);
          const val=all.filter(o=>o.status==="validado");
          const pen=all.filter(o=>o.status==="pendente");
          const rej=all.filter(o=>o.status==="rejeitado");
          const rel=reliability(val);
          return [m.name, all.length, val.length, pen.length, rej.length, rel.mtbf+" d", rel.mttr+" min", rel.availability+"%"];
        }),
        styles:{ font:"helvetica", fontSize:8, cellPadding:4 },
        headStyles:{ fillColor:[15,21,32], textColor:[230,237,247] },
        margin:{ left:40, right:40 },
      });
      const total = doc.internal.getNumberOfPages();
      for(let i=1;i<=total;i++){
        doc.setPage(i); doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(154,167,190);
        doc.text(NOME_EMPRESA + " · BACKUP RESET · página " + i + "/" + total, 40, 825);
      }
      doc.save("backup-utilidades-" + todayISO() + ".pdf");
      return true;
    } catch(e) { notify("Erro ao gerar backup: " + e.message, "err"); return false; }
  }, [oc, user, notify]);

  /* Admin: zerar tudo */
  const adminResetAll = useCallback(async () => {
    if(!db || !adminAuth) return false;
    try {
      const totalAntes = oc.length;
      if(totalAntes === 0) { notify("Não há registros para excluir.", "info"); return false; }
      adminBackupPDF();
      const { error } = await db.from("ocorrencias").delete().neq("id", 0);
      if(error) throw error;
      notify("Todos os " + totalAntes + " registros foram excluídos. Backup PDF salvo.", "info");
      setTimeout(() => openEmail(buildEmailReset(user.nome, totalAntes)), 1200);
      await fetchData();
      return true;
    } catch(e) { notify("Erro ao zerar: " + e.message, "err"); return false; }
  }, [adminAuth, oc, user, fetchData, notify, adminBackupPDF]);

  const value = {
    user, login, logout,
    isAnyValidador, isGerenteGeral,
    isValidadorBruno, isValidadorAlfredo, isValidadorPaulo,
    meusSistemas,
    theme, setTheme,
    oc, fetchData, loading,
    notify,
    adminAuth, verifyAdmin, lockAdmin,
    adminDelete, adminResetAll, adminBackupPDF,
  };

  return (
    <Ctx.Provider value={value}>
      {children}
      {toast && (
        <div className="toast">
          <Icon
            name={toast.kind==="err"?"alert":toast.kind==="info"?"mail":"check"}
            size={16}
            className={toast.kind==="err"?"text-[#ff4d6d]":toast.kind==="info"?"text-[#4fb3ff]":"text-[#00d9a3]"}
          />
          <span>{toast.msg}</span>
        </div>
      )}
    </Ctx.Provider>
  );
}

function LoginScreen() {
  const { login, notify } = useApp();
  const [f, setF] = useState({ nome:"", matricula:"", email:"" });
  const [busy, setBusy] = useState(false);

  const submit = async e => {
    e.preventDefault();
    const nome = f.nome.trim(), mat = f.matricula.trim(), email = f.email.trim().toLowerCase();
    if(!nome || !mat || !email) { notify("Preencha todos os campos.", "err"); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { notify("E-mail inválido.", "err"); return; }
    if(!db) { notify("⚠️ Configure as credenciais do Supabase no arquivo HTML.", "err"); return; }
    setBusy(true);
    try {
      const { data: ex, error } = await db.from("usuarios").select("*").eq("matricula", mat).maybeSingle();
      if(error) throw error;
      if(ex) {
        if(ex.nome.toLowerCase()!==nome.toLowerCase() || ex.email.toLowerCase()!==email)
          await db.from("usuarios").update({ nome, email }).eq("matricula", mat);
      } else {
        const { error: ie } = await db.from("usuarios").insert({ nome, matricula: mat, email });
        if(ie) throw ie;
      }
      login({ nome, matricula: mat, email });
      notify(`Bem-vindo, ${nome.split(" ")[0]}!`);
    } catch(e) {
      notify("Erro ao acessar: " + e.message, "err");
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="login-bg flex items-center justify-center p-4 min-h-screen">
      <div className="login-card reveal">
        <div className="flex items-center gap-3 mb-6">
          <div className="w-12 h-12 rounded-xl flex items-center justify-center" style={{background:"linear-gradient(135deg,#00d9a3,#4fb3ff)"}}>
            <Icon name="factory" size={24} className="text-black"/>
          </div>
          <div>
            <div className="crumb">Painel Industrial</div>
            <div className="text-xl font-extrabold leading-tight">UTILIDADES REAM</div>
          </div>
        </div>

        <h2 className="text-lg font-bold mb-1">Identificação do operador</h2>
        <p className="text-sm mb-5" style={{color:"var(--txt-3)"}}>
          Todo registro ficará vinculado ao seu nome e matrícula para rastreabilidade completa.
        </p>

        <form onSubmit={submit} className="space-y-4">
          <div>
            <label>Nome completo</label>
            <input value={f.nome} onChange={e=>setF({...f,nome:e.target.value})} placeholder="Ex: João da Silva" autoFocus required/>
          </div>
          <div>
            <label>Matrícula</label>
            <input value={f.matricula} onChange={e=>setF({...f,matricula:e.target.value})} placeholder="Ex: 12345" required/>
          </div>
          <div>
            <label>E-mail corporativo</label>
            <input type="email" value={f.email} onChange={e=>setF({...f,email:e.target.value})} placeholder="seu.nome@ream.com.br" required/>
            <p className="text-xs mt-1" style={{color:"var(--txt-3)"}}>Usado para receber retorno caso seu registro precise de ajustes.</p>
          </div>
          <button type="submit" className="btn btn-primary w-full justify-center" disabled={busy}>
            {busy ? <><span className="spinner"/> Acessando…</> : <><Icon name="check" size={15}/>Entrar no painel</>}
          </button>
        </form>

        {!db && (
          <div className="mt-4 panel-flat p-3 text-xs" style={{color:"var(--acc-2)",borderColor:"rgba(255,182,39,.4)"}}>
            <strong>⚠️ Banco não configurado.</strong> As credenciais do Supabase precisam ser inseridas nas constantes <code>SUPABASE_URL</code> e <code>SUPABASE_KEY</code> no início do arquivo HTML.
          </div>
        )}

        <div className="mt-6 pt-4 border-t text-xs flex items-center justify-between" style={{borderColor:"var(--line)",color:"var(--txt-3)"}}>
          <span>Gerente Geral: <strong style={{color:"var(--txt-2)"}}>{GERENTE_GERAL.nome}</strong></span>
          <span className="badge tag-blue"><Icon name="shield" size={11}/>SEGURO</span>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   SHARED COMPONENTS
══════════════════════════════════════════════════════════════ */
function StatusTag({ status }) {
  const m = {
    op:   { cls:"tag-green", label:"Operando",    icon:"check" },
    warn: { cls:"tag-amber", label:"Atenção",     icon:"alert" },
    fail: { cls:"tag-red",   label:"Parado",      icon:"x" },
    none: { cls:"tag-blue",  label:"Sem falhas",  icon:"clock" },
  };
  const v = m[status] || m.none;
  return <span className={`badge ${v.cls}`}><Icon name={v.icon} size={11}/>{v.label}</span>;
}

function ValTag({ status }) {
  if(status==="pendente")  return <span className="badge tag-amber"><Icon name="clock" size={11}/>Pendente</span>;
  if(status==="validado")  return <span className="badge tag-green"><Icon name="check" size={11}/>Validado</span>;
  if(status==="rejeitado") return <span className="badge tag-red"><Icon name="x" size={11}/>Rejeitado</span>;
  return null;
}

function Ring({ value, size=110, stroke=10, color="#00d9a3" }) {
  const r = (size-stroke)/2, c = 2*Math.PI*r, off = c-(Math.max(0,Math.min(100,value))/100)*c;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={size/2} cy={size/2} r={r} strokeWidth={stroke} fill="none" className="ring-track"/>
      <circle cx={size/2} cy={size/2} r={r} strokeWidth={stroke} fill="none"
        stroke={color} strokeLinecap="round" strokeDasharray={c} strokeDashoffset={off}
        className="ring-fill" transform={`rotate(-90 ${size/2} ${size/2})`}/>
      <text x="50%" y="47%" dominantBaseline="middle" textAnchor="middle"
        fontFamily="JetBrains Mono" fontWeight="700" fontSize={size*.21} fill="var(--txt-1)">
        {Number(value).toFixed(1)}
      </text>
      <text x="50%" y="64%" dominantBaseline="middle" textAnchor="middle"
        fontFamily="Manrope" fontSize={size*.09} fill="var(--txt-3)" letterSpacing="1.5">
        DISPONIB. %
      </text>
    </svg>
  );
}

function KPI({ label, value, icon, color }) {
  return (
    <div className="panel p-4 reveal">
      <div className="flex items-start justify-between">
        <div>
          <div className="crumb">{label}</div>
          <div className="mono font-extrabold text-2xl mt-1">{value}</div>
        </div>
        <div className="w-9 h-9 rounded-lg flex items-center justify-center"
          style={{color,background:`color-mix(in srgb,${color} 14%,transparent)`}}>
          <Icon name={icon}/>
        </div>
      </div>
    </div>
  );
}

function KpiRow({ label, value, small }) {
  return (
    <div className="flex items-baseline justify-between gap-3 border-b last:border-0 pb-2 last:pb-0" style={{borderColor:"var(--line)"}}>
      <span className="text-xs uppercase tracking-wider font-semibold" style={{color:"var(--txt-3)"}}>{label}</span>
      <span className={small?"text-sm font-medium text-right max-w-[55%]":"mono font-bold"}>{value}</span>
    </div>
  );
}

function ChartBox({ config, height=260 }) {
  const ref = useRef(null);
  const inst = useRef(null);
  const isLight = document.documentElement.classList.contains("light");
  useEffect(() => {
    if(!ref.current) return;
    inst.current?.destroy();
    const grid = isLight?"rgba(0,0,0,.06)":"rgba(255,255,255,.05)";
    const tick = isLight?"#4a5775":"#9aa7be";
    const m = JSON.parse(JSON.stringify(config));
    m.options = m.options||{};
    m.options.responsive = true;
    m.options.maintainAspectRatio = false;
    m.options.plugins = m.options.plugins||{};
    m.options.plugins.legend = { ...{ labels:{ color:tick, font:{ family:"Manrope", weight:"600", size:11 } } }, ...(m.options.plugins.legend||{}) };
    m.options.scales = m.options.scales||{};
    Object.keys(m.options.scales).forEach(k => {
      m.options.scales[k].ticks = { color:tick, font:{ family:"JetBrains Mono", size:10 }, ...(m.options.scales[k].ticks||{}) };
      m.options.scales[k].grid  = { color:grid, ...(m.options.scales[k].grid||{}) };
    });
    inst.current = new Chart(ref.current, m);
    return () => inst.current?.destroy();
  }, [config, isLight]);
  return <div style={{height}}><canvas ref={ref}/></div>;
}

/* ══════════════════════════════════════════════════════════════
   FAILURE MODAL
══════════════════════════════════════════════════════════════ */
function FailureModal({ open, sysKey, onClose, onDone }) {
  const { user, notify, fetchData } = useApp();
  const emptyForm = { data_ocorrencia: new Date().toISOString().slice(0,16), motivo:"", tempo_parada:"", observacoes:"" };
  const [f, setF] = useState(emptyForm);
  const [busy, setBusy] = useState(false);

  useEffect(() => { if(open) setF(emptyForm); }, [open]);
  if(!open || !sysKey) return null;

  const meta = SISTEMAS[sysKey];
  const val  = getValidador(sysKey);

  const submit = async e => {
    e.preventDefault();
    if(!f.motivo.trim()) { notify("Informe o motivo da falha.", "err"); return; }
    if(!f.tempo_parada || +f.tempo_parada < 0) { notify("Informe o tempo de parada.", "err"); return; }
    setBusy(true);
    try {
      const payload = {
        sistema: sysKey,
        data_ocorrencia: new Date(f.data_ocorrencia).toISOString(),
        motivo: f.motivo.trim(),
        tempo_parada: parseInt(f.tempo_parada),
        observacoes: f.observacoes.trim() || null,
        registrado_por_nome: user.nome,
        registrado_por_matricula: user.matricula,
        registrado_por_email: user.email,
        status: "pendente",
      };
      const { data: inserted, error } = await db.from("ocorrencias").insert(payload).select().single();
      if(error) throw error;
      notify("Registro salvo! Abrindo e-mail para validação…", "info");
      setTimeout(() => openEmail(buildEmailParaValidador(inserted, user)), 900);
      await fetchData();
      onDone?.();
      onClose();
    } catch(e) {
      notify("Erro ao registrar: " + e.message, "err");
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="flex items-start justify-between mb-4">
          <div>
            <div className="crumb">Registro de Ocorrência</div>
            <h2 className="text-xl font-bold mt-1 flex items-center gap-2">
              <span style={{color:meta.accent}}><Icon name={meta.icon}/></span>
              {meta.name}
            </h2>
            <div className="text-xs mt-0.5" style={{color:"var(--txt-3)"}}>{meta.desc}</div>
          </div>
          <button onClick={onClose} className="btn btn-ghost p-1.5"><Icon name="x" size={18}/></button>
        </div>

        <div className="panel-flat p-3 mb-4 flex items-start gap-2 text-xs" style={{color:"var(--txt-2)"}}>
          <Icon name="mail" size={14} className="shrink-0 mt-0.5" style={{color:"#4fb3ff"}}/>
          <span>Após salvar, seu e-mail abrirá com mensagem pré-preenchida para <strong>{val.nome}</strong> ({val.cargo}). Basta clicar <strong>Enviar</strong>. O registro entra no histórico somente após validação.</span>
        </div>

        <form onSubmit={submit} className="space-y-3">
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label>Data e hora</label>
              <input type="datetime-local" value={f.data_ocorrencia}
                onChange={e=>setF({...f,data_ocorrencia:e.target.value})} required/>
            </div>
            <div>
              <label>Tempo de parada (min)</label>
              <input type="number" min="0" placeholder="Ex: 45" value={f.tempo_parada}
                onChange={e=>setF({...f,tempo_parada:e.target.value})} required/>
            </div>
          </div>
          <div>
            <label>Motivo da falha / ocorrência</label>
            <input placeholder="Descreva a causa" value={f.motivo}
              onChange={e=>setF({...f,motivo:e.target.value})} required/>
          </div>
          <div>
            <label>Observações adicionais</label>
            <textarea rows="3" value={f.observacoes}
              onChange={e=>setF({...f,observacoes:e.target.value})}
              placeholder="Ações tomadas, peças substituídas, etc."/>
          </div>
          <div className="flex justify-end gap-2 pt-1">
            <button type="button" className="btn" onClick={onClose}>Cancelar</button>
            <button type="submit" className="btn btn-primary" disabled={busy}>
              {busy ? <><span className="spinner"/> Salvando…</> : <><Icon name="mail" size={15}/>Enviar para validação</>}
            </button>
          </div>
        </form>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   SYSTEM CARD (Home)
══════════════════════════════════════════════════════════════ */
function SysCard({ sysKey, onRegister }) {
  const { oc } = useApp();
  const meta = SISTEMAS[sysKey];
  const val = getValidador(sysKey);
  const validadas = oc.filter(o=>o.sistema===sysKey && o.status==="validado");
  const pendN = oc.filter(o=>o.sistema===sysKey && o.status==="pendente").length;
  const sorted = [...validadas].sort((a,b)=>new Date(b.data_ocorrencia)-new Date(a.data_ocorrencia));
  const last = sorted[0] || null;
  const days = last ? daysSince(last.data_ocorrencia) : null;
  const rel = reliability(validadas);

  const status = !last ? "none" : days < 2 ? "fail" : days < 10 ? "warn" : "op";
  const color = status==="op" ? "#00d9a3" : status==="warn" ? "#ffb627" : status==="fail" ? "#ff4d6d" : "#4fb3ff";

  return (
    <div className="stat-card reveal">
      <div className="accent-line" style={{background:meta.accent}}/>
      <div className="flex items-start justify-between gap-2">
        <div className="flex items-center gap-2.5">
          <div className="w-10 h-10 rounded-xl flex items-center justify-center shrink-0"
            style={{background:`color-mix(in srgb,${meta.accent} 18%,transparent)`,color:meta.accent}}>
            <Icon name={meta.icon} size={20}/>
          </div>
          <div>
            <div className="font-bold leading-tight">{meta.name}</div>
            <div className="text-xs" style={{color:"var(--txt-3)"}}>{meta.desc}</div>
          </div>
        </div>
        <StatusTag status={status}/>
      </div>

      <div className="mt-4 flex items-end justify-between gap-3">
        <div>
          <div className="crumb">Dias sem falha</div>
          <div className="mono font-extrabold leading-none mt-1" style={{fontSize:"3rem",color}}>
            {days===null ? "—" : days}
          </div>
          <div className="text-xs mt-1" style={{color:"var(--txt-3)"}}>
            Última: <span style={{color:"var(--txt-2)"}}>{fmtDate(last?.data_ocorrencia)}</span>
          </div>
        </div>
        <Ring value={+rel.availability} color={color} size={96} stroke={9}/>
      </div>

      <div className="mt-3 panel-flat p-2.5 text-sm">
        <div className="crumb mb-1">Última ocorrência</div>
        <div className="font-medium leading-snug">{last?.motivo || "Sem registros validados"}</div>
        {last && (
          <div className="text-xs mt-1" style={{color:"var(--txt-3)"}}>
            {last.registrado_por_nome} · mat. {last.registrado_por_matricula}
          </div>
        )}
      </div>

      <div className="mt-2.5 grid grid-cols-3 gap-1.5 text-center">
        <div className="panel-flat py-1.5">
          <div className="crumb" style={{fontSize:".58rem"}}>MTBF</div>
          <div className="mono font-bold text-sm">{rel.mtbf}<span className="text-[10px] ml-0.5" style={{color:"var(--txt-3)"}}>d</span></div>
        </div>
        <div className="panel-flat py-1.5">
          <div className="crumb" style={{fontSize:".58rem"}}>MTTR</div>
          <div className="mono font-bold text-sm">{rel.mttr}<span className="text-[10px] ml-0.5" style={{color:"var(--txt-3)"}}>m</span></div>
        </div>
        <div className="panel-flat py-1.5">
          <div className="crumb" style={{fontSize:".58rem"}}>FALHAS</div>
          <div className="mono font-bold text-sm">{rel.count}</div>
        </div>
      </div>

      {pendN>0 && (
        <div className="mt-2 panel-flat px-2.5 py-1.5 text-xs flex items-center gap-1.5" style={{color:"#ffb627"}}>
          <Icon name="clock" size={12}/>{pendN} pendente(s) — aguardando {val.nome}
        </div>
      )}

      <button className="btn btn-danger w-full justify-center mt-3" onClick={()=>onRegister(sysKey)}>
        <Icon name="alert" size={14}/>Registrar Ocorrência
      </button>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   HOME PAGE
══════════════════════════════════════════════════════════════ */
function HomePage() {
  const { oc, fetchData } = useApp();
  const [modal, setModal] = useState(null);

  const ocVal = oc.filter(o=>o.status==="validado");
  const ocPend = oc.filter(o=>o.status==="pendente");

  const avgAvail = (Object.keys(SISTEMAS).reduce((s,k) => {
    return s + parseFloat(reliability(ocVal.filter(o=>o.sistema===k)).availability);
  }, 0) / Object.keys(SISTEMAS).length).toFixed(2);

  const mon30Fail = ocVal.filter(f=>new Date(f.data_ocorrencia)>new Date(Date.now()-30*864e5)).length;
  const totalHorasParada = ocVal.reduce((s,o)=>s+(+o.tempo_parada||0),0);

  // Chart falhas por sistema
  const failCfg = useMemo(() => ({
    type:"bar",
    data:{
      labels: Object.values(SISTEMAS).map(s=>s.name),
      datasets:[{
        label:"Falhas (90d)",
        data: Object.keys(SISTEMAS).map(k =>
          ocVal.filter(o=>o.sistema===k && new Date(o.data_ocorrencia)>new Date(Date.now()-90*864e5)).length
        ),
        backgroundColor: Object.values(SISTEMAS).map(s=>s.accent),
        borderRadius:6,
      }]
    },
    options:{ scales:{ y:{ beginAtZero:true, ticks:{ stepSize:1 } } }, plugins:{ legend:{ display:false } } }
  }), [oc]);

  // Chart tendência mensal
  const trendCfg = useMemo(() => {
    const months = [];
    for(let i=5;i>=0;i--){
      const d = new Date(); d.setMonth(d.getMonth()-i); d.setDate(1);
      const yy=d.getFullYear(), mm=d.getMonth();
      const lbl = d.toLocaleDateString("pt-BR",{month:"short"});
      const cnt = ocVal.filter(o=>{ const fd=new Date(o.data_ocorrencia); return fd.getFullYear()===yy&&fd.getMonth()===mm; }).length;
      const down = ocVal.filter(o=>{ const fd=new Date(o.data_ocorrencia); return fd.getFullYear()===yy&&fd.getMonth()===mm; }).reduce((s,o)=>s+(+o.tempo_parada||0),0);
      months.push({lbl,cnt,down});
    }
    return {
      type:"line",
      data:{
        labels: months.map(m=>m.lbl),
        datasets:[
          { label:"Nº falhas", data:months.map(m=>m.cnt), borderColor:"#ff4d6d", backgroundColor:"rgba(255,77,109,.1)", fill:true, tension:.4, pointRadius:3 },
          { label:"Parada (min)", data:months.map(m=>m.down), borderColor:"#ffb627", backgroundColor:"rgba(255,182,39,.08)", fill:true, tension:.4, pointRadius:3, yAxisID:"y1" },
        ]
      },
      options:{
        scales:{
          y:{ beginAtZero:true, position:"left", ticks:{ stepSize:1 } },
          y1:{ beginAtZero:true, position:"right", grid:{ drawOnChartArea:false } },
        }
      }
    };
  }, [oc]);

  return (
    <div className="space-y-5">
      {/* KPIs */}
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <KPI label="Disponibilidade média" value={avgAvail+"%"} icon="trendUp" color="#00d9a3"/>
        <KPI label="Falhas validadas (30d)" value={mon30Fail} icon="alert" color="#ff4d6d"/>
        <KPI label="Horas paradas (total)" value={fmtNum(totalHorasParada/60,1)+"h"} icon="clock" color="#ffb627"/>
        <KPI label="Total de sistemas" value={Object.keys(SISTEMAS).length} icon="factory" color="#4fb3ff"/>
      </div>

      {/* Aviso de pendentes */}
      {ocPend.length>0 && (
        <div className="panel p-4 flex items-center gap-3 reveal" style={{borderColor:"rgba(255,182,39,.4)"}}>
          <div className="w-10 h-10 rounded-lg flex items-center justify-center shrink-0"
            style={{background:"rgba(255,182,39,.14)",color:"#ffb627"}}>
            <Icon name="clock"/>
          </div>
          <div>
            <div className="font-semibold">{ocPend.length} ocorrência(s) aguardando validação</div>
            <div className="text-xs mt-0.5" style={{color:"var(--txt-3)"}}>
              Indicadores consideram apenas registros validados pelos gerentes setoriais.
            </div>
          </div>
        </div>
      )}

      {/* Cards dos sistemas */}
      <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
        {Object.keys(SISTEMAS).map(k => (
          <SysCard key={k} sysKey={k} onRegister={() => setModal(k)}/>
        ))}
      </div>

      {/* Charts */}
      <div className="grid grid-cols-1 xl:grid-cols-5 gap-4">
        <div className="panel p-5 xl:col-span-3">
          <div className="crumb mb-1">Tendência operacional</div>
          <div className="font-bold text-lg mb-4">Falhas e paradas — últimos 6 meses</div>
          <ChartBox config={trendCfg} height={260}/>
        </div>
        <div className="panel p-5 xl:col-span-2">
          <div className="crumb mb-1">Confiabilidade</div>
          <div className="font-bold text-lg mb-4">Falhas por sistema (90d)</div>
          <ChartBox config={failCfg} height={260}/>
        </div>
      </div>

      {/* Tabela últimas ocorrências */}
      <div className="panel p-5">
        <div className="crumb mb-1">Stream</div>
        <div className="font-bold text-lg mb-4">Últimas ocorrências validadas</div>
        <OcTable data={ocVal.slice(0,10)}/>
      </div>

      <FailureModal open={!!modal} sysKey={modal} onClose={()=>setModal(null)} onDone={fetchData}/>
    </div>
  );
}

function OcTable({ data }) {
  if(!data.length) return (
    <div className="text-sm py-8 text-center" style={{color:"var(--txt-3)"}}>Nenhuma ocorrência validada.</div>
  );
  return (

            <th className="py-2 font-semibold">Motivo</th>
            <th className="py-2 font-semibold">Parada</th>

        <tbody>

            return (
              <tr key={f.id} className="table-row border-t" style={{borderColor:"var(--line)"}}>
                <td className="py-2.5 mono text-xs">{fmtDate(f.data_ocorrencia,true)}</td>
                <td className="py-2.5">
                  <span className="badge" style={{
                    background:`color-mix(in srgb,${sys.accent} 14%,transparent)`,
                    color:sys.accent,
                    borderColor:`color-mix(in srgb,${sys.accent} 30%,transparent)`
                  }}>
                    <Icon name={sys.icon} size={11}/>{sys.name}
                  </span>
                </td>
                <td className="py-2.5 max-w-[180px] truncate">{f.motivo}</td>
                <td className="py-2.5 mono">{f.tempo_parada} min</td>
                <td className="py-2.5 text-xs" style={{color:"var(--txt-2)"}}>
                  {f.registrado_por_nome}<br/>
                  <span className="mono" style={{color:"var(--txt-3)"}}>mat.{f.registrado_por_matricula}</span>
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}
