<style>
  :root{
    --bg-0:#0a0e14;--bg-1:#0f1520;--bg-2:#161e2c;--bg-3:#1d2738;
    --line:#243047;--line-2:#2d3a55;
    --txt-1:#e6edf7;--txt-2:#9aa7be;--txt-3:#5a6885;
    --acc:#00d9a3;--acc-2:#ffb627;--acc-3:#ff4d6d;--acc-4:#4fb3ff;--acc-5:#a78bfa;
    --grid:rgba(255,255,255,.04);
  }
  html.light{
    --bg-0:#f4f6fa;--bg-1:#ffffff;--bg-2:#ffffff;--bg-3:#f0f3f8;
    --line:#dde3ee;--line-2:#c8d1e0;
    --txt-1:#0f1726;--txt-2:#4a5775;--txt-3:#7c8aa8;
    --grid:rgba(0,0,0,.04);
  }
  *{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
  html,body,#root{height:100%;}
  body{background:var(--bg-0);color:var(--txt-1);font-family:'Manrope',system-ui,sans-serif;overflow-x:hidden;}
  .mono{font-family:'JetBrains Mono',monospace;font-feature-settings:"tnum" 1;}
  .grid-bg{
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:32px 32px;
  }
  .panel{background:var(--bg-1);border:1px solid var(--line);border-radius:14px;}
  html.light .panel{box-shadow:0 1px 2px rgba(15,23,38,.04),0 4px 16px rgba(15,23,38,.04);}
  .panel-flat{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;}

  .btn{
    display:inline-flex;align-items:center;gap:.5rem;
    padding:.55rem .9rem;border-radius:10px;
    font-weight:600;font-size:.85rem;
    border:1px solid var(--line-2);background:var(--bg-2);color:var(--txt-1);
    transition:transform .12s ease,background .12s ease,border-color .12s ease;cursor:pointer;
  }
  .btn:hover{transform:translateY(-1px);border-color:var(--txt-3);}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
  .btn-primary{background:var(--acc);color:#04140e;border-color:transparent;}
  .btn-primary:hover{filter:brightness(1.05);}
  .btn-danger{background:var(--acc-3);color:#fff;border-color:transparent;}
  .btn-warn{background:var(--acc-2);color:#3a2900;border-color:transparent;}
  .btn-ghost{background:transparent;}

  .badge{
    display:inline-flex;align-items:center;gap:.35rem;
    padding:.2rem .55rem;border-radius:999px;
    font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    border:1px solid var(--line-2);background:var(--bg-2);color:var(--txt-2);
  }
  .pulse-dot{width:8px;height:8px;border-radius:50%;animation:pulse 1.8s infinite;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(0,217,163,.6);}
    70%{box-shadow:0 0 0 10px rgba(0,217,163,0);}
    100%{box-shadow:0 0 0 0 rgba(0,217,163,0);}
  }
  .scanlines::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px);
    border-radius:inherit;
  }

  input,select,textarea{
    background:var(--bg-2);color:var(--txt-1);
    border:1px solid var(--line-2);border-radius:10px;
    padding:.55rem .75rem;font-size:.9rem;font-family:inherit;
    width:100%;outline:none;transition:border-color .15s,box-shadow .15s;
  }
  input:focus,select:focus,textarea:focus{
    border-color:var(--acc);box-shadow:0 0 0 3px rgba(0,217,163,.18);
  }
  label{font-size:.72rem;font-weight:600;color:var(--txt-2);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:.35rem;}

  .nav-item{
    display:flex;align-items:center;gap:.75rem;
    padding:.7rem .85rem;border-radius:10px;
    color:var(--txt-2);font-weight:500;cursor:pointer;
    border:1px solid transparent;transition:all .12s ease;font-size:.9rem;
  }
  .nav-item:hover{background:var(--bg-2);color:var(--txt-1);}
  .nav-item.active{
    background:linear-gradient(135deg,rgba(0,217,163,.12),rgba(79,179,255,.06));
    color:var(--txt-1);border-color:rgba(0,217,163,.35);
  }
  .nav-item.active .nav-icon{color:var(--acc);}

  .stat-card{
    position:relative;overflow:hidden;
    background:linear-gradient(180deg,var(--bg-1),var(--bg-2));
    border:1px solid var(--line);border-radius:16px;padding:1.25rem;
    transition:border-color .2s ease,transform .2s ease;
  }
  .stat-card:hover{border-color:var(--line-2);}
  .stat-card .accent-line{position:absolute;left:0;top:0;bottom:0;width:3px;}

  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--txt-3);}

  .modal-backdrop{
    position:fixed;inset:0;z-index:50;
    background:rgba(5,8,14,.72);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;
    padding:1rem;animation:fadeIn .15s ease;
  }
  .modal{
    width:100%;max-width:560px;
    background:var(--bg-1);border:1px solid var(--line-2);
    border-radius:16px;padding:1.5rem;
    max-height:90vh;overflow-y:auto;animation:pop .18s ease;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
  .reveal{animation:rise .35s ease both;}
  @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .table-row:hover{background:var(--bg-3);}
  .ring-track{stroke:var(--line);}
  .ring-fill{transition:stroke-dashoffset .8s ease;}

  .toast{
    position:fixed;bottom:1.25rem;right:1.25rem;z-index:60;
    background:var(--bg-1);border:1px solid var(--line-2);
    border-radius:12px;padding:.85rem 1rem;font-size:.85rem;
    display:flex;align-items:center;gap:.6rem;
    animation:rise .25s ease;box-shadow:0 10px 30px rgba(0,0,0,.35);
    max-width:400px;
  }
  .crumb{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--txt-3);letter-spacing:.18em;text-transform:uppercase;}
  h1.title{font-family:'Manrope';font-weight:800;letter-spacing:-.02em;font-size:1.7rem;line-height:1.05;}
  @media(min-width:768px){h1.title{font-size:2rem;}}

  .tag-green{background:rgba(0,217,163,.12);color:var(--acc);border:1px solid rgba(0,217,163,.3);}
  .tag-amber{background:rgba(255,182,39,.12);color:var(--acc-2);border:1px solid rgba(255,182,39,.3);}
  .tag-red{background:rgba(255,77,109,.12);color:var(--acc-3);border:1px solid rgba(255,77,109,.3);}
  .tag-blue{background:rgba(79,179,255,.12);color:var(--acc-4);border:1px solid rgba(79,179,255,.3);}
  .tag-violet{background:rgba(167,139,250,.12);color:var(--acc-5);border:1px solid rgba(167,139,250,.3);}

  .mobile-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;}

  .login-bg{
    position:fixed;inset:0;
    background:radial-gradient(circle at 20% 30%,rgba(0,217,163,.15),transparent 40%),
      radial-gradient(circle at 80% 70%,rgba(79,179,255,.12),transparent 45%),var(--bg-0);
    overflow:hidden;
  }
  .login-bg::before{
    content:"";position:absolute;inset:0;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:40px 40px;
    mask-image:radial-gradient(ellipse at center,black 30%,transparent 70%);
  }
  .login-card{
    position:relative;z-index:2;width:100%;max-width:440px;
    background:var(--bg-1);border:1px solid var(--line-2);
    border-radius:18px;padding:2rem;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  .spinner{
    width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;
    border-radius:50%;animation:spin .8s linear infinite;display:inline-block;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
</style>

/* ===================================================================== UTILS */
const fmtDate = (iso, withTime=false) => {
  if(!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleString("pt-BR", withTime
    ? {day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}
    : {day:"2-digit",month:"2-digit",year:"numeric"});
};
const todayISO = () => new Date().toISOString().slice(0,10);
const daysSince = (iso) => {
  if(!iso) return null;
  return Math.floor((Date.now() - new Date(iso).getTime()) / (1000*60*60*24));
};
const fmtNum = (n, d=2) => Number(n||0).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtMoney = (n) => Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});

function reliability(history) {
  if(!history||!history.length) return {mtbf:"∞",mttr:0,availability:100,count:0};
  const totalDown = history.reduce((s,f)=>s+(Number(f.tempo_parada)||0),0);
  const mttr = totalDown/history.length;
  const sorted = [...history].sort((a,b)=>new Date(a.data_ocorrencia)-new Date(b.data_ocorrencia));
  let mtbf = 0;
  if(sorted.length>=2){
    const span=(new Date(sorted[sorted.length-1].data_ocorrencia)-new Date(sorted[0].data_ocorrencia))/(1000*60*60*24);
    mtbf=span/Math.max(1,sorted.length-1);
  } else {
    mtbf=daysSince(sorted[0].data_ocorrencia)||0;
  }
  const cutoff=Date.now()-30*24*60*60*1000;
  const recent=history.filter(f=>new Date(f.data_ocorrencia).getTime()>cutoff);
  const downMin=recent.reduce((s,f)=>s+(Number(f.tempo_parada)||0),0);
  const availability=Math.max(0,Math.min(100,100-(downMin/(30*24*60))*100));
  return {
    mtbf:typeof mtbf==="number"?mtbf.toFixed(1):mtbf,
    mttr:mttr.toFixed(0),
    availability:availability.toFixed(2),
    count:history.length
  };
}

const SYS = {
  termico:     {name:"Sistema Térmico",   icon:"flame",accent:"var(--acc-3)",desc:"Caldeiras, vapor e combustão"},
  eletrica:    {name:"Energia Elétrica",  icon:"bolt", accent:"var(--acc-2)",desc:"Distribuição e disponibilidade"},
  refrigeracao:{name:"Refrigeração",      icon:"snow", accent:"var(--acc-4)",desc:"Câmaras frias e amônia"},
  arComprimido:{name:"Ar Comprimido",     icon:"wind", accent:"var(--acc-5)",desc:"Rede pneumática"},
};

/* ===================================================================== EMAIL */
function openEmail({to,subject,body}){
  window.location.href=`mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

function buildEmailValidacao(rec, user, kind){
  let det="";
  if(kind==="ocorrencia"){
    det=`\nSistema: ${SYS[rec.sistema]?.name||rec.sistema}\nData/hora: ${fmtDate(rec.data_ocorrencia,true)}\nMotivo: ${rec.motivo}\nTempo de parada: ${rec.tempo_parada} minutos\nObservações: ${rec.observacoes||"—"}`;
  } else {
    const sub=rec.tipo_movimento==="entrada"?"ENTRADA":rec.tipo_movimento==="consumo"?"CONSUMO":"VENDA";
    let extra="";
    if(rec.tipo_movimento==="entrada") extra=`\nFornecedor: ${rec.fornecedor}\nTipo: ${rec.tipo_biomassa}\nUmidade: ${rec.umidade}%`;
    else if(rec.tipo_movimento==="consumo") extra=`\nCaldeira: ${rec.caldeira}\nProdução: ${rec.producao} t\nEficiência: ${rec.eficiencia}%`;
    else extra=`\nCliente: ${rec.cliente}\nValor: ${fmtMoney(rec.valor)}`;
    det=`\nTipo: ${sub}\nData: ${fmtDate(rec.data_movimento)}\nQuantidade: ${rec.quantidade} t${extra}\nObservações: ${rec.observacoes||"—"}`;
  }
  return {
    to:EMAIL_VALIDADOR,
    subject:`[VALIDAÇÃO] ${kind==="ocorrencia"?"OCORRÊNCIA":"BIOMASSA"} — ${user.nome} (mat. ${user.matricula})`,
    body:`Prezado ${NOME_VALIDADOR},\n\nFoi registrada uma nova informação no Painel de Utilidades aguardando sua validação:\n\nREGISTRADO POR\nNome: ${user.nome}\nMatrícula: ${user.matricula}\nE-mail: ${user.email}\n\nDETALHES${det}\n\nID: #${rec.id}\n\nAcesse o painel, aba "Pendentes", para validar ou rejeitar.\n\n—\n${NOME_EMPRESA}`
  };
}

function buildEmailRejeicao(rec, operador, motivo){
  const tipo=rec.sistema?"ocorrência de falha":"registro de biomassa";
  return {
    to:operador.email,
    subject:`[AJUSTES NECESSÁRIOS] Seu ${tipo} precisa de revisão`,
    body:`Prezado(a) ${operador.nome},\n\nSeu registro de ${tipo} no Painel de Utilidades foi avaliado e necessita de ajustes.\n\nMOTIVO INFORMADO PELO ${NOME_VALIDADOR.toUpperCase()} (${CARGO_VALIDADOR}):\n${motivo}\n\nID do registro: #${rec.id}\n\nPor favor, registre novamente com as correções. Em dúvidas, contate ${NOME_VALIDADOR} (${EMAIL_VALIDADOR}).\n\n—\n${NOME_EMPRESA}`
  };
}

/* ===================================================================== CONTEXT */
const Ctx = createContext(null);
const useApp = () => useContext(Ctx);

function Provider({children}){
  const [user,setUser]=useState(()=>{
    try{return JSON.parse(localStorage.getItem("ream-user")||"null");}catch{return null;}
  });
  const [theme,setTheme]=useState(()=>localStorage.getItem("ream-theme")||"dark");
  const [toast,setToast]=useState(null);
  const [recs,setRecs]=useState({oc:[],bm:[]});
  const [loading,setLoading]=useState(false);

  useEffect(()=>{document.documentElement.classList.toggle("light",theme==="light");localStorage.setItem("ream-theme",theme);},[theme]);

  const notify=(msg,kind="ok")=>{setToast({msg,kind});setTimeout(()=>setToast(null),3500);};

  const fetch=async()=>{
    if(!db||!user)return;
    setLoading(true);
    try{
      const [a,b]=await Promise.all([
        db.from("ocorrencias").select("*").order("data_ocorrencia",{ascending:false}),
        db.from("biomassa").select("*").order("data_movimento",{ascending:false}),
      ]);
      if(a.error)throw a.error;
      if(b.error)throw b.error;
      setRecs({oc:a.data||[],bm:b.data||[]});
    }catch(e){notify("Erro ao carregar dados: "+e.message,"err");}
    finally{setLoading(false);}
  };

  useEffect(()=>{if(user)fetch();},[user]);

  const login=(u)=>{localStorage.setItem("ream-user",JSON.stringify(u));setUser(u);};
  const logout=()=>{localStorage.removeItem("ream-user");setUser(null);};
  const isValidator=user&&user.email&&user.email.toLowerCase()===EMAIL_VALIDADOR.toLowerCase();

  return(
    <Ctx.Provider value={{user,login,logout,isValidator,theme,setTheme,recs,fetch,loading,notify}}>
      {children}
      {toast&&(
        <div className="toast">
          <Icon name={toast.kind==="err"?"alert":toast.kind==="info"?"mail":"check"}
            className={toast.kind==="err"?"text-[color:var(--acc-3)]":toast.kind==="info"?"text-[color:var(--acc-4)]":"text-[color:var(--acc)]"}/>
          <span>{toast.msg}</span>
        </div>
      )}
    </Ctx.Provider>
  );
}

/* ===================================================================== LOGIN */
function LoginScreen(){
  const {login,notify}=useApp();
  const [f,setF]=useState({nome:"",matricula:"",email:""});
  const [busy,setBusy]=useState(false);

  const submit=async(e)=>{
    e.preventDefault();
    if(!f.nome.trim()||!f.matricula.trim()||!f.email.trim()){notify("Preencha todos os campos.","err");return;}
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email)){notify("E-mail inválido.","err");return;}
    if(!db){notify("⚠️ Configure as credenciais do Supabase no arquivo (COLE_AQUI_SUA_URL).","err");return;}
    setBusy(true);
    try{
      const mat=f.matricula.trim(),nome=f.nome.trim(),email=f.email.trim().toLowerCase();
      const {data:ex,error}=await db.from("usuarios").select("*").eq("matricula",mat).maybeSingle();
      if(error)throw error;
      if(ex){
        if(ex.nome.toLowerCase()!==nome.toLowerCase()||ex.email.toLowerCase()!==email)
          await db.from("usuarios").update({nome,email}).eq("matricula",mat);
      } else {
        await db.from("usuarios").insert({nome,matricula:mat,email});
      }
      login({nome,matricula:mat,email});
      notify(`Bem-vindo, ${nome.split(" ")[0]}!`);
    }catch(e){notify("Erro: "+e.message,"err");}
    finally{setBusy(false);}
  };

  return(
    <div className="login-bg flex items-center justify-center p-4 min-h-screen">
      <div className="login-card reveal">
        <div className="flex items-center gap-3 mb-6">
          <div className="w-12 h-12 rounded-xl flex items-center justify-center" style={{background:"linear-gradient(135deg,var(--acc),var(--acc-4))"}}>
            <Icon name="factory" size={24} className="text-black"/>
          </div>
          <div>
            <div className="crumb">Painel Industrial</div>
            <div className="text-xl font-extrabold leading-tight">UTILIDADES REAM</div>
          </div>
        </div>

        <div className="mb-5">
          <h2 className="text-lg font-bold">Identificação do operador</h2>
          <p className="text-sm mt-1" style={{color:"var(--txt-3)"}}>
            Informe seus dados. Todo registro ficará vinculado ao seu nome e matrícula para rastreabilidade completa.
          </p>
        </div>

        <form onSubmit={submit} className="space-y-4">
          <div>
            <label>Nome completo</label>
            <input value={f.nome} onChange={e=>setF({...f,nome:e.target.value})} placeholder="Ex: João da Silva" autoFocus required/>
          </div>
          <div>
            <label>Matrícula</label>
            <input value={f.matricula} onChange={e=>setF({...f,matricula:e.target.value})} placeholder="Ex: 12345" required/>
          </div>
          <div>
            <label>E-mail corporativo</label>
            <input type="email" value={f.email} onChange={e=>setF({...f,email:e.target.value})} placeholder="seu.nome@ream.com.br" required/>
            <div className="text-xs mt-1.5" style={{color:"var(--txt-3)"}}>
              Usado para receber retorno caso seu registro precise de ajustes.
            </div>
          </div>
          <button type="submit" className="btn btn-primary w-full justify-center mt-2" disabled={busy}>
            {busy?<><span className="spinner"/>&nbsp;Acessando...</>:<><Icon name="check" size={15}/>Entrar no painel</>}
          </button>
        </form>

        {!db&&(
          <div className="mt-4 panel-flat p-3 text-xs" style={{color:"var(--acc-2)",borderColor:"rgba(255,182,39,.4)"}}>
            <strong>⚠️ Banco não configurado.</strong> Abra o arquivo HTML, localize <code>COLE_AQUI_SUA_URL</code> e cole suas credenciais do Supabase. Veja o GUIA-INSTALACAO.md.
          </div>
        )}

        <div className="mt-6 pt-4 border-t text-xs flex items-center justify-between" style={{borderColor:"var(--line)",color:"var(--txt-3)"}}>
          <span>Validador: <strong style={{color:"var(--txt-2)"}}>{NOME_VALIDADOR}</strong></span>
          <span className="badge tag-blue"><Icon name="shield" size={11}/>SEGURO</span>
        </div>
      </div>
    </div>
  );
}

/* ===================================================================== SHARED COMPONENTS */
function StatusTag({status}){
  const m={op:{cls:"tag-green",label:"Operando",icon:"check"},warn:{cls:"tag-amber",label:"Atenção",icon:"alert"},fail:{cls:"tag-red",label:"Parado",icon:"x"},none:{cls:"tag-blue",label:"Sem falhas",icon:"clock"}};
  const v=m[status];
  return<span className={`badge ${v.cls}`}><Icon name={v.icon} size={12}/>{v.label}</span>;
}
function ValTag({status}){
  if(status==="pendente")return<span className="badge tag-amber"><Icon name="clock" size={11}/>Pendente</span>;
  if(status==="validado")return<span className="badge tag-green"><Icon name="check" size={11}/>Validado</span>;
  return<span className="badge tag-red"><Icon name="x" size={11}/>Rejeitado</span>;
}

function Ring({value,size=110,stroke=10,color="var(--acc)"}){
  const r=(size-stroke)/2,c=2*Math.PI*r,off=c-(Math.max(0,Math.min(100,value))/100)*c;
  return(
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={size/2} cy={size/2} r={r} strokeWidth={stroke} fill="none" className="ring-track"/>
      <circle cx={size/2} cy={size/2} r={r} strokeWidth={stroke} fill="none" stroke={color} strokeLinecap="round"
        strokeDasharray={c} strokeDashoffset={off} className="ring-fill" transform={`rotate(-90 ${size/2} ${size/2})`}/>
      <text x="50%" y="48%" dominantBaseline="middle" textAnchor="middle" fontFamily="JetBrains Mono" fontWeight="700" fontSize={size*.22} fill="var(--txt-1)">{Number(value).toFixed(1)}</text>
      <text x="50%" y="65%" dominantBaseline="middle" textAnchor="middle" fontFamily="Manrope" fontSize={size*.10} fill="var(--txt-3)" letterSpacing="2">DISPONIBILIDADE %</text>
    </svg>
  );
}

function KPI({label,value,icon,color}){
  return(
    <div className="panel p-4 reveal">
      <div className="flex items-start justify-between">
        <div>
          <div className="crumb">{label}</div>
          <div className="mono font-extrabold text-2xl mt-1">{value}</div>
        </div>
        <div className="w-9 h-9 rounded-lg flex items-center justify-center" style={{color,background:`color-mix(in srgb,${color} 14%,transparent)`}}>
          <Icon name={icon}/>
        </div>
      </div>
    </div>
  );
}

function KpiRow({label,value,small}){
  return(
    <div className="flex items-baseline justify-between gap-3 border-b last:border-0 pb-2 last:pb-0" style={{borderColor:"var(--line)"}}>
      <span className="text-xs uppercase tracking-wider font-semibold" style={{color:"var(--txt-3)"}}>{label}</span>
      <span className={small?"text-sm font-medium text-right":"mono font-bold"}>{value}</span>
    </div>
  );
}

function ChartBox({config,height=260}){
  const ref=useRef(null);const inst=useRef(null);
  const isLight=document.documentElement.classList.contains("light");
  useEffect(()=>{
    if(!ref.current)return;
    if(inst.current)inst.current.destroy();
    const grid=isLight?"rgba(0,0,0,.06)":"rgba(255,255,255,.05)";
    const tick=isLight?"#4a5775":"#9aa7be";
    const m=JSON.parse(JSON.stringify(config));
    m.options=m.options||{};m.options.responsive=true;m.options.maintainAspectRatio=false;
    m.options.plugins=m.options.plugins||{};
    m.options.plugins.legend=Object.assign({labels:{color:tick,font:{family:"Manrope",weight:"600"}}},m.options.plugins.legend||{});
    m.options.scales=m.options.scales||{};
    Object.keys(m.options.scales).forEach(k=>{
      m.options.scales[k].ticks=Object.assign({color:tick,font:{family:"JetBrains Mono",size:11}},m.options.scales[k].ticks||{});
      m.options.scales[k].grid=Object.assign({color:grid},m.options.scales[k].grid||{});
    });
    inst.current=new Chart(ref.current,m);
    return()=>{if(inst.current)inst.current.destroy();};
  },[config,isLight]);
  return<div style={{height}}><canvas ref={ref}/></div>;
}

/* ===================================================================== FAILURE MODAL */
function FailureModal({open,sysKey,onClose,onDone}){
  const {user,notify,fetch}=useApp();
  const [f,setF]=useState({data_ocorrencia:new Date().toISOString().slice(0,16),motivo:"",tempo_parada:"",observacoes:""});
  const [busy,setBusy]=useState(false);
  useEffect(()=>{if(open)setF({data_ocorrencia:new Date().toISOString().slice(0,16),motivo:"",tempo_parada:"",observacoes:""});},[open]);
  if(!open||!sysKey)return null;

  const submit=async(e)=>{
    e.preventDefault();
    if(!f.motivo||!f.tempo_parada){notify("Preencha motivo e tempo de parada","err");return;}
    setBusy(true);
    try{
      const payload={
        sistema:sysKey,
        data_ocorrencia:new Date(f.data_ocorrencia).toISOString(),
        motivo:f.motivo,tempo_parada:parseInt(f.tempo_parada),
        observacoes:f.observacoes||null,
        registrado_por_nome:user.nome,registrado_por_matricula:user.matricula,registrado_por_email:user.email,
        status:"pendente",
      };
      const {data:inserted,error}=await db.from("ocorrencias").insert(payload).select().single();
      if(error)throw error;
      notify("Registro enviado! Abrindo e-mail para validação…","info");
      setTimeout(()=>openEmail(buildEmailValidacao(inserted,user,"ocorrencia")),900);
      fetch();onDone&&onDone();onClose();
    }catch(e){notify("Erro: "+e.message,"err");}
    finally{setBusy(false);}
  };

  const meta=SYS[sysKey];
  return(
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="flex items-start justify-between mb-4">
          <div>
            <div className="crumb">Registro de Falha</div>
            <h2 className="text-xl font-bold mt-1 flex items-center gap-2">
              <Icon name={meta.icon} className="text-[color:var(--acc-3)]"/>{meta.name}
            </h2>
          </div>
          <button onClick={onClose} className="btn btn-ghost p-2"><Icon name="x"/></button>
        </div>
        <div className="panel-flat p-3 mb-4 text-xs flex items-start gap-2" style={{color:"var(--txt-2)"}}>
          <Icon name="mail" size={14} className="mt-0.5 shrink-0 text-[color:var(--acc-4)]"/>
          <div>Após salvar, seu cliente de e-mail abrirá com mensagem pré-preenchida para <strong>{NOME_VALIDADOR}</strong>. Basta clicar <strong>Enviar</strong>. O registro entra no histórico somente após validação.</div>
        </div>
        <form onSubmit={submit} className="space-y-3">
          <div className="grid grid-cols-2 gap-3">
            <div><label>Data e hora</label><input type="datetime-local" value={f.data_ocorrencia} onChange={e=>setF({...f,data_ocorrencia:e.target.value})} required/></div>
            <div><label>Tempo de parada (min)</label><input type="number" min="0" placeholder="Ex: 45" value={f.tempo_parada} onChange={e=>setF({...f,tempo_parada:e.target.value})} required/></div>
          </div>
          <div><label>Motivo da falha</label><input placeholder="Causa da ocorrência" value={f.motivo} onChange={e=>setF({...f,motivo:e.target.value})} required/></div>
          <div><label>Observações</label><textarea rows="3" value={f.observacoes} onChange={e=>setF({...f,observacoes:e.target.value})}/></div>
          <div className="flex justify-end gap-2 pt-2">
            <button type="button" className="btn" onClick={onClose}>Cancelar</button>
            <button type="submit" className="btn btn-primary" disabled={busy}>
              {busy?<><span className="spinner"/>&nbsp;Enviando…</>:<><Icon name="mail" size={15}/>Enviar para validação</>}
            </button>
          </div>
        </form>
      </div>
    </div>
  );
}

/* ===================================================================== SYSTEM CARD */
function SysCard({sysKey,onRegister}){
  const {recs}=useApp();
  const meta=SYS[sysKey];
  const validadas=recs.oc.filter(o=>o.sistema===sysKey&&o.status==="validado");
  const sorted=[...validadas].sort((a,b)=>new Date(b.data_ocorrencia)-new Date(a.data_ocorrencia));
  const last=sorted[0]||null;
  const days=last?daysSince(last.data_ocorrencia):null;
  const rel=reliability(validadas);
  const pendN=recs.oc.filter(o=>o.sistema===sysKey&&o.status==="pendente").length;
  const status=!last?"none":days<2?"fail":days<10?"warn":"op";
  const color=status==="op"?"var(--acc)":status==="warn"?"var(--acc-2)":status==="fail"?"var(--acc-3)":"var(--acc-4)";

  return(
    <div className="stat-card reveal">
      <div className="accent-line" style={{background:meta.accent}}/>
      <div className="flex items-start justify-between">
        <div className="flex items-center gap-3">
          <div className="w-11 h-11 rounded-xl flex items-center justify-center" style={{background:`color-mix(in srgb,${meta.accent} 18%,transparent)`,color:meta.accent}}>
            <Icon name={meta.icon} size={22}/>
          </div>
          <div>
            <div className="font-bold text-lg leading-tight">{meta.name}</div>
            <div className="text-xs" style={{color:"var(--txt-3)"}}>{meta.desc}</div>
          </div>
        </div>
        <StatusTag status={status}/>
      </div>

      <div className="mt-5 flex items-end justify-between gap-4">
        <div>
          <div className="crumb">Dias sem falha</div>
          <div className="mono font-extrabold leading-none mt-1" style={{fontSize:"3.4rem",color}}>{days===null?"—":days}</div>
          <div className="text-xs mt-1" style={{color:"var(--txt-3)"}}>Última: <span style={{color:"var(--txt-2)"}}>{fmtDate(last?.data_ocorrencia)}</span></div>
        </div>
        <Ring value={rel.availability} color={color} size={104}/>
      </div>

      <div className="mt-4 panel-flat p-3 text-sm">
        <div className="crumb mb-1">Motivo da última ocorrência</div>
        <div className="font-medium">{last?.motivo||"Sem registros validados"}</div>
        {last&&<div className="text-xs mt-1" style={{color:"var(--txt-3)"}}>Por {last.registrado_por_nome} (mat. {last.registrado_por_matricula})</div>}
      </div>

      <div className="mt-3 grid grid-cols-3 gap-2 text-center">
        <div className="panel-flat py-2"><div className="crumb">MTBF</div><div className="mono font-bold text-sm">{rel.mtbf}<span className="text-[10px] ml-1" style={{color:"var(--txt-3)"}}>d</span></div></div>
        <div className="panel-flat py-2"><div className="crumb">MTTR</div><div className="mono font-bold text-sm">{rel.mttr}<span className="text-[10px] ml-1" style={{color:"var(--txt-3)"}}>min</span></div></div>
        <div className="panel-flat py-2"><div className="crumb">Falhas</div><div className="mono font-bold text-sm">{rel.count}</div></div>
      </div>

      {pendN>0&&(
        <div className="mt-3 panel-flat p-2 text-xs flex items-center gap-2" style={{color:"var(--acc-2)"}}>
          <Icon name="clock" size={13}/>{pendN} ocorrência(s) aguardam validação
        </div>
      )}

      <div className="mt-4">
        <button className="btn btn-danger w-full justify-center" onClick={()=>onRegister(sysKey)}>
          <Icon name="alert" size={15}/>Registrar Falha
        </button>
      </div>
    </div>
  );
}

/* ===================================================================== HOME */
function HomePage(){
  const {recs,fetch}=useApp();
  const [modal,setModal]=useState(null);

  const ocVal=recs.oc.filter(o=>o.status==="validado");
  const bmVal=recs.bm.filter(b=>b.status==="validado");
  const ocPend=recs.oc.filter(o=>o.status==="pendente");

  const avgAvail=(Object.keys(SYS).reduce((s,k)=>s+parseFloat(reliability(ocVal.filter(o=>o.sistema===k)).availability),0)/4).toFixed(2);
  const mon30Fail=ocVal.filter(f=>new Date(f.data_ocorrencia).getTime()>Date.now()-30*24*60*60*1000).length;
  const con30=bmVal.filter(b=>b.tipo_movimento==="consumo"&&new Date(b.data_movimento).getTime()>Date.now()-30*24*60*60*1000).reduce((s,b)=>s+(+b.quantidade||0),0);
  const rev30=bmVal.filter(b=>b.tipo_movimento==="venda"&&new Date(b.data_movimento).getTime()>Date.now()-30*24*60*60*1000).reduce((s,b)=>s+(+b.valor||0),0);

  const failCfg=useMemo(()=>({
    type:"bar",
    data:{
      labels:["Térmico","Elétrica","Refrigeração","Ar Comprimido"],
      datasets:[{
        label:"Falhas (90d)",
        data:Object.keys(SYS).map(k=>ocVal.filter(o=>o.sistema===k&&new Date(o.data_ocorrencia).getTime()>Date.now()-90*24*60*60*1000).length),
        backgroundColor:["#ff4d6d","#ffb627","#4fb3ff","#a78bfa"],borderRadius:6,
      }]
    },
    options:{scales:{y:{beginAtZero:true,ticks:{stepSize:1}}},plugins:{legend:{display:false}}}
  }),[recs]);

  const bioCfg=useMemo(()=>{
    const days=[];
    for(let i=13;i>=0;i--){
      const d=new Date();d.setDate(d.getDate()-i);d.setHours(0,0,0,0);
      const ds=d.toISOString().slice(0,10);
      const lbl=d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});
      const ent=bmVal.filter(b=>b.tipo_movimento==="entrada"&&b.data_movimento.slice(0,10)===ds).reduce((s,b)=>s+(+b.quantidade||0),0);
      const con=bmVal.filter(b=>b.tipo_movimento==="consumo"&&b.data_movimento.slice(0,10)===ds).reduce((s,b)=>s+(+b.quantidade||0),0);
      days.push({lbl,ent,con});
    }
    return{
      type:"line",
      data:{labels:days.map(d=>d.lbl),datasets:[
        {label:"Recebido (t)",data:days.map(d=>d.ent),borderColor:"#00d9a3",backgroundColor:"rgba(0,217,163,.1)",fill:true,tension:.4,pointRadius:0},
        {label:"Consumido (t)",data:days.map(d=>d.con),borderColor:"#ff4d6d",backgroundColor:"rgba(255,77,109,.08)",fill:true,tension:.4,pointRadius:0},
      ]},
      options:{scales:{y:{beginAtZero:true}}}
    };
  },[recs]);

  return(
    <div className="space-y-5">
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <KPI label="Disponibilidade média" value={avgAvail+"%"} icon="trend-up" color="var(--acc)"/>
        <KPI label="Falhas validadas (30d)" value={mon30Fail} icon="alert" color="var(--acc-3)"/>
        <KPI label="Consumo biomassa 30d" value={fmtNum(con30,1)+" t"} icon="leaf" color="var(--acc-4)"/>
        <KPI label="Receita venda 30d" value={fmtMoney(rev30)} icon="scale" color="var(--acc-2)"/>
      </div>

      {ocPend.length>0&&(
        <div className="panel p-4 flex items-center gap-3 reveal" style={{borderColor:"rgba(255,182,39,.4)"}}>
          <div className="w-10 h-10 rounded-lg flex items-center justify-center" style={{background:"rgba(255,182,39,.14)",color:"var(--acc-2)"}}>
            <Icon name="clock"/>
          </div>
          <div className="flex-1">
            <div className="font-semibold">{ocPend.length} ocorrência(s) aguardando validação do {NOME_VALIDADOR}</div>
            <div className="text-xs mt-0.5" style={{color:"var(--txt-3)"}}>Indicadores consideram apenas registros validados.</div>
          </div>
        </div>
      )}

      <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
        {Object.keys(SYS).map(k=><SysCard key={k} sysKey={k} onRegister={()=>setModal(k)}/>)}
      </div>

      <div className="grid grid-cols-1 xl:grid-cols-3 gap-4">
        <div className="panel p-5 xl:col-span-2">
          <div className="flex items-center justify-between mb-4">
            <div><div className="crumb">Tendência operacional</div><div className="font-bold text-lg">Biomassa — Últimos 14 dias</div></div>
            <Icon name="leaf" className="text-[color:var(--acc)]"/>
          </div>
          <ChartBox config={bioCfg} height={260}/>
        </div>
        <div className="panel p-5">
          <div className="flex items-center justify-between mb-4">
            <div><div className="crumb">Confiabilidade</div><div className="font-bold text-lg">Falhas por sistema</div></div>
            <Icon name="alert" className="text-[color:var(--acc-3)]"/>
          </div>
          <ChartBox config={failCfg} height={260}/>
        </div>
      </div>

      <div className="panel p-5">
        <div className="crumb mb-1">Stream</div>
        <div className="font-bold text-lg mb-4">Últimas ocorrências validadas</div>
        <RecentTable data={ocVal.slice(0,8)}/>
      </div>

      <FailureModal open={!!modal} sysKey={modal} onClose={()=>setModal(null)} onDone={fetch}/>
    </div>
  );
}

function RecentTable({data}){
  if(!data.length)return<div className="text-sm py-6 text-center" style={{color:"var(--txt-3)"}}>Nenhuma ocorrência validada.</div>;
  return(
    <div className="overflow-x-auto">
      <table className="w-full text-sm">
        <thead><tr className="text-left" style={{color:"var(--txt-3)"}}>
          <th className="py-2">Data</th><th className="py-2">Sistema</th><th className="py-2">Motivo</th><th className="py-2">Parada</th><th className="py-2">Operador</th>
        </tr></thead>
        <tbody>
          {data.map(f=>(
            <tr key={f.id} className="table-row border-t" style={{borderColor:"var(--line)"}}>
              <td className="py-2.5 mono text-xs">{fmtDate(f.data_ocorrencia,true)}</td>
              <td className="py-2.5">
                <span className="badge" style={{background:`color-mix(in srgb,${SYS[f.sistema].accent} 14%,transparent)`,color:SYS[f.sistema].accent,borderColor:`color-mix(in srgb,${SYS[f.sistema].accent} 30%,transparent)`}}>
                  <Icon name={SYS[f.sistema].icon} size={12}/>{SYS[f.sistema].name}
                </span>
              </td>
              <td className="py-2.5">{f.motivo}</td>
              <td className="py-2.5 mono">{f.tempo_parada} min</td>
              <td className="py-2.5 text-xs" style={{color:"var(--txt-2)"}}>{f.registrado_por_nome}<br/><span className="mono" style={{color:"var(--txt-3)"}}>mat.{f.registrado_por_matricula}</span></td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

/* ===================================================================== SYSTEM PAGE */
function SysPage({sysKey}){
  const {recs,fetch}=useApp();
  const meta=SYS[sysKey];
  const validadas=recs.oc.filter(o=>o.sistema===sysKey&&o.status==="validado");
  const pendentes=recs.oc.filter(o=>o.sistema===sysKey&&o.status==="pendente");
  const sorted=[...validadas].sort((a,b)=>new Date(b.data_ocorrencia)-new Date(a.data_ocorrencia));
  const last=sorted[0]||null;
  const days=last?daysSince(last.data_ocorrencia):null;
  const rel=reliability(validadas);
  const status=!last?"none":days<2?"fail":days<10?"warn":"op";
  const color=status==="op"?"var(--acc)":status==="warn"?"var(--acc-2)":status==="fail"?"var(--acc-3)":"var(--acc-4)";
  const [modal,setModal]=useState(false);

  const trendCfg=useMemo(()=>{
    const months=[];
    for(let i=5;i>=0;i--){
      const d=new Date();d.setMonth(d.getMonth()-i);d.setDate(1);
      const yy=d.getFullYear(),mm=d.getMonth();
      const lbl=d.toLocaleDateString("pt-BR",{month:"short"});
      const items=validadas.filter(f=>{const fd=new Date(f.data_ocorrencia);return fd.getFullYear()===yy&&fd.getMonth()===mm;});
      months.push({lbl,sum:items.reduce((s,f)=>s+(+f.tempo_parada||0),0),cnt:items.length});
    }
    return{
      type:"bar",
      data:{labels:months.map(m=>m.lbl),datasets:[
        {type:"bar",label:"Tempo parado (min)",data:months.map(m=>m.sum),backgroundColor:meta.accent,borderRadius:6,yAxisID:"y"},
        {type:"line",label:"Nº falhas",data:months.map(m=>m.cnt),borderColor:"#ffffff",backgroundColor:"#ffffff",tension:.4,yAxisID:"y1",pointRadius:4},
      ]},
      options:{scales:{y:{beginAtZero:true,position:"left"},y1:{beginAtZero:true,position:"right",grid:{drawOnChartArea:false},ticks:{stepSize:1}}}}
    };
  },[validadas,meta]);

  return(
    <div className="space-y-5">
      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <div className="panel p-6 lg:col-span-2 relative overflow-hidden scanlines">
          <div className="absolute -right-10 -top-10 w-48 h-48 rounded-full" style={{background:`radial-gradient(circle,${meta.accent}33,transparent 70%)`}}/>
          <div className="flex items-center gap-3">
            <div className="w-12 h-12 rounded-xl flex items-center justify-center" style={{color:meta.accent,background:`color-mix(in srgb,${meta.accent} 18%,transparent)`}}>
              <Icon name={meta.icon} size={26}/>
            </div>
            <div><div className="crumb">{meta.desc}</div><div className="text-xl font-extrabold">{meta.name}</div></div>
            <div className="ml-auto"><StatusTag status={status}/></div>
          </div>
          <div className="mt-6 grid grid-cols-2 gap-4">
            <div>
              <div className="crumb">Dias sem falha</div>
              <div className="mono font-extrabold leading-none mt-1" style={{fontSize:"4.2rem",color}}>{days===null?"—":days}</div>
              <div className="text-xs mt-1" style={{color:"var(--txt-3)"}}>Última: {fmtDate(last?.data_ocorrencia,true)}</div>
            </div>
            <div className="flex justify-end items-center"><Ring value={rel.availability} color={color} size={150} stroke={12}/></div>
          </div>
          <div className="mt-6 flex flex-wrap gap-2">
            <button className="btn btn-danger" onClick={()=>setModal(true)}><Icon name="alert" size={15}/>Registrar Falha</button>
          </div>
          {pendentes.length>0&&(
            <div className="mt-3 panel-flat p-2.5 text-xs flex items-center gap-2" style={{color:"var(--acc-2)"}}>
              <Icon name="clock" size={14}/>{pendentes.length} ocorrência(s) aguardam validação
            </div>
          )}
        </div>
        <div className="panel p-6 space-y-3">
          <div className="crumb">Indicadores (validados)</div>
          <KpiRow label="MTBF" value={`${rel.mtbf} dias`}/>
          <KpiRow label="MTTR" value={`${rel.mttr} min`}/>
          <KpiRow label="Disponibilidade (30d)" value={`${rel.availability}%`}/>
          <KpiRow label="Total de falhas" value={rel.count}/>
          <KpiRow label="Última ocorrência" value={fmtDate(last?.data_ocorrencia)} small/>
          <KpiRow label="Motivo" value={last?.motivo||"—"} small/>
          <KpiRow label="Registrado por" value={last?`${last.registrado_por_nome} (${last.registrado_por_matricula})`:"—"} small/>
        </div>
      </div>

      <div className="panel p-5">
        <div className="crumb mb-1">Tendência</div>
        <div className="font-bold text-lg mb-4">Paradas por mês — últimos 6 meses</div>
        <ChartBox config={trendCfg} height={300}/>
      </div>

      <div className="panel p-5">
        <div className="crumb mb-1">Histórico</div>
        <div className="font-bold text-lg mb-4">Ocorrências validadas</div>
        <RecentTable data={validadas}/>
      </div>

      <FailureModal open={modal} sysKey={sysKey} onClose={()=>setModal(false)} onDone={fetch}/>
    </div>
  );
}

/* ===================================================================== BIOMASSA */
function BiomassPage(){
  const [tab,setTab]=useState("entrada");
  return(
    <div className="space-y-5">
      <div className="flex flex-wrap gap-2 border-b pb-3" style={{borderColor:"var(--line)"}}>
        {[{k:"entrada",l:"Entradas",i:"truck"},{k:"consumo",l:"Consumo",i:"flame"},{k:"venda",l:"Vendas",i:"scale"},{k:"overview",l:"Resumo",i:"trend-up"}].map(t=>(
          <button key={t.k} className={`btn ${tab===t.k?"btn-primary":""}`} onClick={()=>setTab(t.k)}>
            <Icon name={t.i} size={15}/>{t.l}
          </button>
        ))}
      </div>
      {tab==="overview"?<BioOverview/>:<BioForm kind={tab}/>}
    </div>
  );
}

function BioForm({kind}){
  const {user,recs,notify,fetch}=useApp();
  const [f,setF]=useState({data_movimento:todayISO(),quantidade:"",fornecedor:"",tipo_biomassa:"Cavaco de madeira",umidade:"",caldeira:"Caldeira 01",producao:"",eficiencia:"",cliente:"",valor:"",observacoes:""});
  const [busy,setBusy]=useState(false);

  const submit=async(e)=>{
    e.preventDefault();
    if(!f.quantidade){notify("Preencha a quantidade","err");return;}
    if(kind==="entrada"&&!f.fornecedor){notify("Informe o fornecedor","err");return;}
    if(kind==="venda"&&!f.cliente){notify("Informe o cliente","err");return;}
    setBusy(true);
    try{
      const payload={
        tipo_movimento:kind,
        data_movimento:new Date(f.data_movimento+"T12:00:00").toISOString(),
        quantidade:+f.quantidade,observacoes:f.observacoes||null,
        registrado_por_nome:user.nome,registrado_por_matricula:user.matricula,registrado_por_email:user.email,
        status:"pendente",
        ...(kind==="entrada"?{fornecedor:f.fornecedor,tipo_biomassa:f.tipo_biomassa,umidade:f.umidade?+f.umidade:null}:{}),
        ...(kind==="consumo"?{caldeira:f.caldeira,producao:f.producao?+f.producao:null,eficiencia:f.eficiencia?+f.eficiencia:null}:{}),
        ...(kind==="venda"?{cliente:f.cliente,valor:f.valor?+f.valor:null}:{}),
      };
      const {data:ins,error}=await db.from("biomassa").insert(payload).select().single();
      if(error)throw error;
      notify("Registro enviado! Abrindo e-mail para validação…","info");
      setTimeout(()=>openEmail(buildEmailValidacao(ins,user,"biomassa")),900);
      setF({...f,quantidade:"",fornecedor:"",umidade:"",producao:"",eficiencia:"",cliente:"",valor:"",observacoes:""});
      fetch();
    }catch(e){notify("Erro: "+e.message,"err");}
    finally{setBusy(false);}
  };

  const list=recs.bm.filter(b=>b.tipo_movimento===kind&&b.status==="validado");

  return(
    <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <form onSubmit={submit} className="panel p-5 space-y-3">
        <div className="crumb">{kind==="entrada"?"Nova entrada":kind==="consumo"?"Novo consumo":"Nova venda"}</div>
        <div className="font-bold text-lg">{kind==="entrada"?"Registrar recebimento":kind==="consumo"?"Registrar consumo diário":"Registrar venda"}</div>
        <div className="panel-flat p-2.5 text-xs flex items-start gap-2" style={{color:"var(--txt-2)"}}>
          <Icon name="mail" size={14} className="mt-0.5 shrink-0 text-[color:var(--acc-4)]"/>
          <span>Após salvar, abrirá e-mail para validação por {NOME_VALIDADOR}.</span>
        </div>
        <div><label>Data</label><input type="date" value={f.data_movimento} onChange={e=>setF({...f,data_movimento:e.target.value})}/></div>
        <div><label>Quantidade (toneladas)</label><input type="number" step="0.01" value={f.quantidade} onChange={e=>setF({...f,quantidade:e.target.value})} required/></div>
        {kind==="entrada"&&<>
          <div><label>Fornecedor</label><input value={f.fornecedor} onChange={e=>setF({...f,fornecedor:e.target.value})} required/></div>
          <div><label>Tipo</label><select value={f.tipo_biomassa} onChange={e=>setF({...f,tipo_biomassa:e.target.value})}>
            {["Cavaco de madeira","Bagaço de cana","Casca de arroz","Pellets","Briquetes","Serragem","Caroço de açaí"].map(o=><option key={o}>{o}</option>)}
          </select></div>
          <div><label>Umidade (%)</label><input type="number" step="0.1" value={f.umidade} onChange={e=>setF({...f,umidade:e.target.value})}/></div>
        </>}
        {kind==="consumo"&&<>
          <div><label>Caldeira</label><select value={f.caldeira} onChange={e=>setF({...f,caldeira:e.target.value})}>
            <option>Caldeira 01</option><option>Caldeira 02</option><option>Caldeira 03</option>
          </select></div>
          <div><label>Produção (t)</label><input type="number" step="0.01" value={f.producao} onChange={e=>setF({...f,producao:e.target.value})}/></div>
          <div><label>Eficiência térmica (%)</label><input type="number" step="0.1" value={f.eficiencia} onChange={e=>setF({...f,eficiencia:e.target.value})}/></div>
        </>}
        {kind==="venda"&&<>
          <div><label>Cliente</label><input value={f.cliente} onChange={e=>setF({...f,cliente:e.target.value})} required/></div>
          <div><label>Valor total (R$)</label><input type="number" step="0.01" value={f.valor} onChange={e=>setF({...f,valor:e.target.value})}/></div>
        </>}
        <div><label>Observações</label><textarea rows="2" value={f.observacoes} onChange={e=>setF({...f,observacoes:e.target.value})}/></div>
        <button type="submit" className="btn btn-primary w-full" disabled={busy}>
          {busy?<><span className="spinner"/>&nbsp;Enviando…</>:<><Icon name="mail" size={15}/>Enviar para validação</>}
        </button>
      </form>

      <div className="panel p-5 lg:col-span-2">
        <div className="flex items-center justify-between mb-4">
          <div><div className="crumb">Histórico (validados)</div><div className="font-bold text-lg">{kind==="entrada"?"Entradas":kind==="consumo"?"Consumo diário":"Vendas"}</div></div>
          <span className="badge tag-green">{list.length} registros</span>
        </div>
        {!list.length?<div className="text-sm py-6 text-center" style={{color:"var(--txt-3)"}}>Sem registros validados.</div>:(
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead><tr className="text-left" style={{color:"var(--txt-3)"}}>
                <th className="py-2">Data</th><th className="py-2">Qtd (t)</th>
                {kind==="entrada"&&<><th className="py-2">Fornecedor</th><th className="py-2">Tipo</th><th className="py-2">Umid.</th></>}
                {kind==="consumo"&&<><th className="py-2">Caldeira</th><th className="py-2">Produção</th><th className="py-2">Efic.</th></>}
                {kind==="venda"&&<><th className="py-2">Cliente</th><th className="py-2">Valor</th></>}
                <th className="py-2">Operador</th>
              </tr></thead>
              <tbody>
                {list.slice(0,40).map(b=>(
                  <tr key={b.id} className="table-row border-t" style={{borderColor:"var(--line)"}}>
                    <td className="py-2.5 mono text-xs">{fmtDate(b.data_movimento)}</td>
                    <td className="py-2.5 mono font-semibold">{fmtNum(b.quantidade)}</td>
                    {kind==="entrada"&&<><td className="py-2.5">{b.fornecedor}</td><td className="py-2.5 text-xs" style={{color:"var(--txt-2)"}}>{b.tipo_biomassa}</td><td className="py-2.5 mono text-xs">{b.umidade!=null?fmtNum(b.umidade,1)+"%":"—"}</td></>}
                    {kind==="consumo"&&<><td className="py-2.5">{b.caldeira}</td><td className="py-2.5 mono">{b.producao!=null?fmtNum(b.producao,1):"—"}</td><td className="py-2.5 mono">{b.eficiencia!=null?fmtNum(b.eficiencia,1)+"%":"—"}</td></>}
                    {kind==="venda"&&<><td className="py-2.5">{b.cliente}</td><td className="py-2.5 mono text-[color:var(--acc)]">{b.valor!=null?fmtMoney(b.valor):"—"}</td></>}
                    <td className="py-2.5 text-xs" style={{color:"var(--txt-2)"}}>{b.registrado_por_nome}<br/><span className="mono" style={{color:"var(--txt-3)"}}>mat.{b.registrado_por_matricula}</span></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

function BioOverview(){
  const {recs}=useApp();
  const val=recs.bm.filter(b=>b.status==="validado");
  const cut=Date.now()-30*24*60*60*1000;
  const ent30=val.filter(b=>b.tipo_movimento==="entrada"&&new Date(b.data_movimento).getTime()>cut).reduce((s,b)=>s+(+b.quantidade||0),0);
  const con30=val.filter(b=>b.tipo_movimento==="consumo"&&new Date(b.data_movimento).getTime()>cut).reduce((s,b)=>s+(+b.quantidade||0),0);
  const ven30=val.filter(b=>b.tipo_movimento==="venda"&&new Date(b.data_movimento).getTime()>cut).reduce((s,b)=>s+(+b.quantidade||0),0);
  const rev30=val.filter(b=>b.tipo_movimento==="venda"&&new Date(b.data_movimento).getTime()>cut).reduce((s,b)=>s+(+b.valor||0),0);

  const mensCfg=useMemo(()=>{
    const months=[];
    for(let i=5;i>=0;i--){
      const d=new Date();d.setMonth(d.getMonth()-i);d.setDate(1);
      const yy=d.getFullYear(),mm=d.getMonth();
      const match=(b)=>{const dd=new Date(b.data_movimento);return dd.getFullYear()===yy&&dd.getMonth()===mm;};
      months.push({
        lbl:d.toLocaleDateString("pt-BR",{month:"short",year:"2-digit"}),
        ent:val.filter(b=>b.tipo_movimento==="entrada"&&match(b)).reduce((s,b)=>s+(+b.quantidade||0),0),
        con:val.filter(b=>b.tipo_movimento==="consumo"&&match(b)).reduce((s,b)=>s+(+b.quantidade||0),0),
        ven:val.filter(b=>b.tipo_movimento==="venda"&&match(b)).reduce((s,b)=>s+(+b.quantidade||0),0),
      });
    }
    return{type:"bar",data:{labels:months.map(m=>m.lbl),datasets:[
      {label:"Recebido",data:months.map(m=>m.ent),backgroundColor:"#00d9a3",borderRadius:6},
      {label:"Consumido",data:months.map(m=>m.con),backgroundColor:"#ff4d6d",borderRadius:6},
      {label:"Vendido",data:months.map(m=>m.ven),backgroundColor:"#ffb627",borderRadius:6},
    ]},options:{scales:{y:{beginAtZero:true}}}};
  },[val]);

  const effCfg=useMemo(()=>{
    const list=val.filter(b=>b.tipo_movimento==="consumo"&&b.eficiencia).sort((a,b)=>new Date(a.data_movimento)-new Date(b.data_movimento)).slice(-30);
    return{type:"line",data:{labels:list.map(b=>new Date(b.data_movimento).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})),datasets:[{label:"Eficiência (%)",data:list.map(b=>b.eficiencia),borderColor:"#4fb3ff",backgroundColor:"rgba(79,179,255,.1)",fill:true,tension:.4,pointRadius:0}]},options:{scales:{y:{beginAtZero:false,suggestedMin:50,suggestedMax:95}}}};
  },[val]);

  return(
    <div className="space-y-5">
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <KPI label="Recebido (30d)" value={fmtNum(ent30,1)+" t"} icon="truck" color="var(--acc)"/>
        <KPI label="Consumido (30d)" value={fmtNum(con30,1)+" t"} icon="flame" color="var(--acc-3)"/>
        <KPI label="Vendido (30d)" value={fmtNum(ven30,1)+" t"} icon="scale" color="var(--acc-2)"/>
        <KPI label="Receita (30d)" value={fmtMoney(rev30)} icon="trend-up" color="var(--acc-4)"/>
      </div>
      <div className="grid grid-cols-1 xl:grid-cols-3 gap-4">
        <div className="panel p-5 xl:col-span-2">
          <div className="crumb mb-1">Comparativo mensal</div>
          <div className="font-bold text-lg mb-4">Movimentação de biomassa — últimos 6 meses</div>
          <ChartBox config={mensCfg} height={300}/>
        </div>
        <div className="panel p-5">
          <div className="crumb mb-1">Operação</div>
          <div className="font-bold text-lg mb-4">Eficiência térmica</div>
          <ChartBox config={effCfg} height={300}/>
        </div>
      </div>
    </div>
  );
}

/* ===================================================================== PENDENTES */
function PendingPage(){
  const {recs,fetch,isValidator,notify,user}=useApp();
  if(!isValidator)return(
    <div className="panel p-8 text-center">
      <Icon name="lock" size={32} className="mx-auto mb-3 text-[color:var(--acc-3)]"/>
      <div className="font-bold text-lg">Acesso restrito</div>
      <div className="text-sm mt-1" style={{color:"var(--txt-3)"}}>Apenas {NOME_VALIDADOR} pode validar registros.</div>
    </div>
  );

  const ocPend=recs.oc.filter(o=>o.status==="pendente");
  const bmPend=recs.bm.filter(b=>b.status==="pendente");

  const aprovar=async(tbl,item)=>{
    try{
      const {error}=await db.from(tbl).update({status:"validado",validado_em:new Date().toISOString()}).eq("id",item.id);
      if(error)throw error;
      notify("Registro validado e publicado no histórico.");fetch();
    }catch(e){notify("Erro: "+e.message,"err");}
  };

  const rejeitar=async(tbl,item)=>{
    const motivo=prompt(`Informe o motivo do ajuste (será enviado por e-mail para ${item.registrado_por_nome}):`);
    if(!motivo)return;
    try{
      const {error}=await db.from(tbl).update({status:"rejeitado",motivo_rejeicao:motivo}).eq("id",item.id);
      if(error)throw error;
      const op={nome:item.registrado_por_nome,matricula:item.registrado_por_matricula,email:item.registrado_por_email};
      notify("Rejeitado. Abrindo e-mail para o operador…","info");
      setTimeout(()=>openEmail(buildEmailRejeicao(item,op,motivo)),900);
      fetch();
    }catch(e){notify("Erro: "+e.message,"err");}
  };

  const PendCard=({item,tbl})=>(
    <div className="panel-flat p-4">
      <div className="flex flex-wrap items-start justify-between gap-3">
        <div className="flex-1 min-w-[260px]">
          <div className="flex items-center gap-2 mb-1.5 flex-wrap">
            {tbl==="ocorrencias"?(
              <span className="badge" style={{background:`color-mix(in srgb,${SYS[item.sistema].accent} 14%,transparent)`,color:SYS[item.sistema].accent,borderColor:`color-mix(in srgb,${SYS[item.sistema].accent} 30%,transparent)`}}>
                <Icon name={SYS[item.sistema].icon} size={11}/>{SYS[item.sistema].name}
              </span>
            ):(
              <span className="badge tag-blue"><Icon name="leaf" size={11}/>{item.tipo_movimento.toUpperCase()}</span>
            )}
            <span className="text-xs mono" style={{color:"var(--txt-3)"}}>{fmtDate(item.data_ocorrencia||item.data_movimento,true)}</span>
          </div>
          {tbl==="ocorrencias"&&<>
            <div className="font-semibold">{item.motivo}</div>
            <div className="text-xs mt-1" style={{color:"var(--txt-3)"}}>Parada: <span className="mono">{item.tempo_parada} min</span>{item.observacoes&&<> · {item.observacoes}</>}</div>
          </>}
          {tbl==="biomassa"&&<>
            <div className="font-semibold">{fmtNum(item.quantidade)} t{item.fornecedor&&<> · <span style={{color:"var(--txt-2)"}}>{item.fornecedor}</span></>}{item.cliente&&<> · <span style={{color:"var(--txt-2)"}}>{item.cliente}</span></>}{item.caldeira&&<> · <span style={{color:"var(--txt-2)"}}>{item.caldeira}</span></>}</div>
            <div className="text-xs mt-1" style={{color:"var(--txt-3)"}}>
              {item.tipo_biomassa&&<>Tipo: {item.tipo_biomassa} · </>}
              {item.umidade!=null&&<>Umidade: {item.umidade}% · </>}
              {item.eficiencia!=null&&<>Efic.: {item.eficiencia}% · </>}
              {item.valor!=null&&<>Valor: {fmtMoney(item.valor)}</>}
              {item.observacoes&&<><br/>{item.observacoes}</>}
            </div>
          </>}
          <div className="text-xs mt-2 flex items-center gap-1.5" style={{color:"var(--txt-2)"}}>
            <Icon name="user" size={12}/>
            <strong>{item.registrado_por_nome}</strong> · mat.{item.registrado_por_matricula} · {item.registrado_por_email}
          </div>
        </div>
        <div className="flex gap-2">
          <button className="btn btn-primary" onClick={()=>aprovar(tbl,item)}><Icon name="check" size={14}/>Validar</button>
          <button className="btn btn-danger" onClick={()=>rejeitar(tbl,item)}><Icon name="x" size={14}/>Rejeitar</button>
        </div>
      </div>
    </div>
  );

  return(
    <div className="space-y-5">
      <div className="panel p-5 flex items-center gap-3">
        <div className="w-10 h-10 rounded-lg flex items-center justify-center" style={{background:"rgba(167,139,250,.14)",color:"var(--acc-5)"}}>
          <Icon name="shield"/>
        </div>
        <div>
          <div className="crumb">Modo validador</div>
          <div className="font-bold text-lg">Olá, {user.nome.split(" ")[0]}</div>
          <div className="text-xs mt-0.5" style={{color:"var(--txt-3)"}}>Aprove para incluir no histórico. Rejeite informando o motivo — o operador receberá um e-mail automático.</div>
        </div>
      </div>

      <div className="panel p-5">
        <div className="flex items-center justify-between mb-4">
          <div><div className="crumb">Falhas pendentes</div><div className="font-bold text-lg">Ocorrências aguardando aprovação</div></div>
          <span className="badge tag-amber">{ocPend.length}</span>
        </div>
        {!ocPend.length?<div className="text-sm py-6 text-center" style={{color:"var(--txt-3)"}}>Nenhuma ocorrência pendente. ✓</div>:(
          <div className="space-y-3">{ocPend.map(o=><PendCard key={o.id} item={o} tbl="ocorrencias"/>)}</div>
        )}
      </div>

      <div className="panel p-5">
        <div className="flex items-center justify-between mb-4">
          <div><div className="crumb">Biomassa pendente</div><div className="font-bold text-lg">Movimentações aguardando aprovação</div></div>
          <span className="badge tag-amber">{bmPend.length}</span>
        </div>
        {!bmPend.length?<div className="text-sm py-6 text-center" style={{color:"var(--txt-3)"}}>Nenhuma movimentação pendente. ✓</div>:(
          <div className="space-y-3">{bmPend.map(b=><PendCard key={b.id} item={b} tbl="biomassa"/>)}</div>
        )}
      </div>
    </div>
  );
}

/* ===================================================================== HISTÓRICO */
function HistoryPage(){
  const {recs}=useApp();
  const [q,setQ]=useState(""),
        [sys,setSys]=useState("all"),
        [status,setStatus]=useState("validado"),
        [from,setFrom]=useState(""),
        [to,setTo]=useState("");

  const filtered=useMemo(()=>recs.oc.filter(f=>{
    if(status!=="all"&&f.status!==status)return false;
    if(sys!=="all"&&f.sistema!==sys)return false;
    if(q&&!((f.motivo||"")+" "+(f.registrado_por_nome||"")+" "+(f.registrado_por_matricula||"")+" "+(f.observacoes||"")).toLowerCase().includes(q.toLowerCase()))return false;
    if(from&&new Date(f.data_ocorrencia)<new Date(from))return false;
    if(to&&new Date(f.data_ocorrencia)>new Date(to+"T23:59"))return false;
    return true;
  }),[recs,q,sys,status,from,to]);

  const reasonMap={};
  filtered.filter(f=>f.status==="validado").forEach(f=>{reasonMap[f.motivo]=(reasonMap[f.motivo]||0)+1;});
  const ranking=Object.entries(reasonMap).sort((a,b)=>b[1]-a[1]).slice(0,5);

  return(
    <div className="space-y-5">
      <div className="panel p-5">
        <div className="grid grid-cols-1 md:grid-cols-6 gap-3 items-end">
          <div className="md:col-span-2">
            <label>Buscar</label>
            <div className="relative">
              <Icon name="search" size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-[color:var(--txt-3)]"/>
              <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Motivo, operador, matrícula…" style={{paddingLeft:"2.25rem"}}/>
            </div>
          </div>
          <div><label>Sistema</label>
            <select value={sys} onChange={e=>setSys(e.target.value)}>
              <option value="all">Todos</option>
              {Object.entries(SYS).map(([k,v])=><option key={k} value={k}>{v.name}</option>)}
            </select>
          </div>
          <div><label>Status</label>
            <select value={status} onChange={e=>setStatus(e.target.value)}>
              <option value="validado">Validados</option>
              <option value="pendente">Pendentes</option>
              <option value="rejeitado">Rejeitados</option>
              <option value="all">Todos</option>
            </select>
          </div>
          <div><label>De</label><input type="date" value={from} onChange={e=>setFrom(e.target.value)}/></div>
          <div><label>Até</label><input type="date" value={to} onChange={e=>setTo(e.target.value)}/></div>
        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <div className="panel p-5 lg:col-span-2">
          <div className="flex items-center justify-between mb-4">
            <div><div className="crumb">Resultados</div><div className="font-bold text-lg">{filtered.length} ocorrências</div></div>
          </div>
          {!filtered.length?<div className="text-sm py-6 text-center" style={{color:"var(--txt-3)"}}>Nenhum resultado.</div>:(
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead><tr className="text-left" style={{color:"var(--txt-3)"}}>
                  <th className="py-2">Data</th><th className="py-2">Sistema</th><th className="py-2">Motivo</th><th className="py-2">Status</th><th className="py-2">Operador</th>
                </tr></thead>
                <tbody>
                  {filtered.map(f=>(
                    <tr key={f.id} className="table-row border-t" style={{borderColor:"var(--line)"}}>
                      <td className="py-2.5 mono text-xs">{fmtDate(f.data_ocorrencia,true)}</td>
                      <td className="py-2.5">
                        <span className="badge" style={{background:`color-mix(in srgb,${SYS[f.sistema].accent} 14%,transparent)`,color:SYS[f.sistema].accent,borderColor:`color-mix(in srgb,${SYS[f.sistema].accent} 30%,transparent)`}}>
                          <Icon name={SYS[f.sistema].icon} size={12}/>{SYS[f.sistema].name}
                        </span>
                      </td>
                      <td className="py-2.5">{f.motivo}<br/><span className="mono text-xs" style={{color:"var(--txt-3)"}}>{f.tempo_parada} min</span></td>
                      <td className="py-2.5"><ValTag status={f.status}/></td>
                      <td className="py-2.5 text-xs" style={{color:"var(--txt-2)"}}>{f.registrado_por_nome}<br/><span className="mono" style={{color:"var(--txt-3)"}}>mat.{f.registrado_por_matricula}</span></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
        <div className="panel p-5">
          <div className="crumb mb-2">Top 5</div>
          <div className="font-bold text-lg mb-4">Causas mais frequentes (validadas)</div>
          {!ranking.length?<div className="text-sm" style={{color:"var(--txt-3)"}}>Sem dados.</div>:(
            <div className="space-y-3">
              {ranking.map(([r,c],i)=>{
                const pct=(c/ranking[0][1])*100;
                return(
                  <div key={r}>
                    <div className="flex justify-between text-sm mb-1">
                      <span className="font-medium truncate pr-2">{i+1}. {r}</span>
                      <span className="mono font-bold">{c}</span>
                    </div>
                    <div className="h-2 rounded-full overflow-hidden" style={{background:"var(--bg-3)"}}>
                      <div className="h-full rounded-full" style={{width:`${pct}%`,background:"linear-gradient(90deg,var(--acc-3),var(--acc-2))"}}/>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ===================================================================== RELATÓRIOS */
function ReportsPage(){
  const {recs,notify}=useApp();
  const [period,setPeriod]=useState("30");
  const [busy,setBusy]=useState(false);

  const generate=async()=>{
    setBusy(true);
    try{
      const {jsPDF}=window.jspdf;
      const doc=new jsPDF({unit:"pt",format:"a4"});
      const W=doc.internal.pageSize.getWidth();
      const days=parseInt(period);const cutoff=Date.now()-days*24*60*60*1000;
      const ocVal=recs.oc.filter(o=>o.status==="validado");
      const bmVal=recs.bm.filter(b=>b.status==="validado");

      doc.setFillColor(15,21,32);doc.rect(0,0,W,80,"F");
      doc.setFillColor(0,217,163);doc.rect(0,80,W,3,"F");
      doc.setTextColor(230,237,247);
      doc.setFont("helvetica","bold");doc.setFontSize(20);
      doc.text("RELATÓRIO DE UTILIDADES INDUSTRIAIS",40,38);
      doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(154,167,190);
      doc.text(NOME_EMPRESA,40,56);
      doc.text(`Período: últimos ${days} dias  ·  Emitido: ${new Date().toLocaleString("pt-BR")}`,40,70);

      let y=110;
      doc.setTextColor(15,23,38);doc.setFont("helvetica","bold");doc.setFontSize(14);
      doc.text("1. Indicadores de Confiabilidade",40,y);y+=20;
      doc.autoTable({startY:y,head:[["Sistema","Falhas no período","MTBF","MTTR","Disponibilidade"]],
        body:Object.entries(SYS).map(([k,m])=>{const list=ocVal.filter(o=>o.sistema===k);const rec=list.filter(f=>new Date(f.data_ocorrencia).getTime()>cutoff);const rel=reliability(list);return[m.name,rec.length,`${rel.mtbf} d`,`${rel.mttr} min`,`${rel.availability}%`];}),
        styles:{font:"helvetica",fontSize:10,cellPadding:6},headStyles:{fillColor:[29,39,56],textColor:[230,237,247]},alternateRowStyles:{fillColor:[245,247,250]},margin:{left:40,right:40}});
      y=doc.lastAutoTable.finalY+24;

      doc.setFont("helvetica","bold");doc.setFontSize(14);doc.setTextColor(15,23,38);
      doc.text("2. Ocorrências validadas no período",40,y);
      const allFail=ocVal.filter(f=>new Date(f.data_ocorrencia).getTime()>cutoff).sort((a,b)=>new Date(b.data_ocorrencia)-new Date(a.data_ocorrencia));
      doc.autoTable({startY:y+10,head:[["Data","Sistema","Motivo","Parada (min)","Operador (mat.)"]],
        body:allFail.length?allFail.map(f=>[fmtDate(f.data_ocorrencia,true),SYS[f.sistema].name,f.motivo,f.tempo_parada,`${f.registrado_por_nome} (${f.registrado_por_matricula})`]):[["—","Sem ocorrências","","",""]],
        styles:{font:"helvetica",fontSize:9,cellPadding:5},headStyles:{fillColor:[29,39,56],textColor:[230,237,247]},margin:{left:40,right:40}});
      y=doc.lastAutoTable.finalY+24;

      if(y>700){doc.addPage();y=50;}
      doc.setFont("helvetica","bold");doc.setFontSize(14);
      doc.text("3. Ranking de causas",40,y);
      const rm={};allFail.forEach(f=>{rm[f.motivo]=(rm[f.motivo]||0)+1;});
      const rank=Object.entries(rm).sort((a,b)=>b[1]-a[1]).slice(0,10);
      doc.autoTable({startY:y+10,head:[["#","Causa","Ocorrências"]],body:rank.length?rank.map((r,i)=>[i+1,r[0],r[1]]):[["—","Sem dados",""]],styles:{font:"helvetica",fontSize:10},headStyles:{fillColor:[29,39,56],textColor:[230,237,247]},margin:{left:40,right:40}});
      y=doc.lastAutoTable.finalY+24;

      if(y>650){doc.addPage();y=50;}
      doc.setFont("helvetica","bold");doc.setFontSize(14);
      doc.text("4. Biomassa — Resumo",40,y);
      const ent=bmVal.filter(b=>b.tipo_movimento==="entrada"&&new Date(b.data_movimento).getTime()>cutoff);
      const con=bmVal.filter(b=>b.tipo_movimento==="consumo"&&new Date(b.data_movimento).getTime()>cutoff);
      const ven=bmVal.filter(b=>b.tipo_movimento==="venda"&&new Date(b.data_movimento).getTime()>cutoff);
      const totP=con.reduce((s,b)=>s+(+b.producao||0),0);
      const avgEff=con.filter(b=>b.eficiencia).length?con.filter(b=>b.eficiencia).reduce((s,b)=>s+(+b.eficiencia||0),0)/con.filter(b=>b.eficiencia).length:0;
      doc.autoTable({startY:y+10,head:[["Indicador","Valor"]],body:[
        ["Total recebido (t)",fmtNum(ent.reduce((s,b)=>s+(+b.quantidade||0),0),2)],
        ["Total consumido (t)",fmtNum(con.reduce((s,b)=>s+(+b.quantidade||0),0),2)],
        ["Total vendido (t)",fmtNum(ven.reduce((s,b)=>s+(+b.quantidade||0),0),2)],
        ["Receita de venda",fmtMoney(ven.reduce((s,b)=>s+(+b.valor||0),0))],
        ["Eficiência térmica média",fmtNum(avgEff,1)+"%"],
        ["Consumo específico (t cons./t prod.)",totP?fmtNum(con.reduce((s,b)=>s+(+b.quantidade||0),0)/totP,3):"—"],
      ],styles:{font:"helvetica",fontSize:10},headStyles:{fillColor:[29,39,56],textColor:[230,237,247]},margin:{left:40,right:40}});

      const total=doc.internal.getNumberOfPages();
      for(let i=1;i<=total;i++){
        doc.setPage(i);doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(154,167,190);
        doc.text(`${NOME_EMPRESA} · página ${i}/${total}`,40,825);
        doc.text(new Date().toLocaleString("pt-BR"),W-40,825,{align:"right"});
      }
      doc.save(`relatorio-utilidades-${todayISO()}.pdf`);
      notify("PDF gerado com sucesso!");
    }catch(e){console.error(e);notify("Erro ao gerar PDF","err");}
    finally{setBusy(false);}
  };

  const exportXls=()=>{
    const wb=XLSX.utils.book_new();
    const ocVal=recs.oc.filter(o=>o.status==="validado");
    const bmVal=recs.bm.filter(b=>b.status==="validado");
    Object.entries(SYS).forEach(([k,m])=>{
      const ws=XLSX.utils.json_to_sheet(ocVal.filter(o=>o.sistema===k).map(f=>({Data:fmtDate(f.data_ocorrencia,true),Motivo:f.motivo,"Parada (min)":f.tempo_parada,Operador:f.registrado_por_nome,Matrícula:f.registrado_por_matricula,Email:f.registrado_por_email,Observações:f.observacoes||""})));
      XLSX.utils.book_append_sheet(wb,ws,m.name.slice(0,30));
    });
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(bmVal.filter(b=>b.tipo_movimento==="entrada").map(b=>({Data:fmtDate(b.data_movimento),Qtd:b.quantidade,Fornecedor:b.fornecedor,Tipo:b.tipo_biomassa,Umidade:b.umidade,Operador:b.registrado_por_nome,Matrícula:b.registrado_por_matricula}))),"Entradas Biomassa");
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(bmVal.filter(b=>b.tipo_movimento==="consumo").map(b=>({Data:fmtDate(b.data_movimento),Qtd:b.quantidade,Caldeira:b.caldeira,Produção:b.producao,Eficiência:b.eficiencia,Operador:b.registrado_por_nome,Matrícula:b.registrado_por_matricula}))),"Consumo Biomassa");
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(bmVal.filter(b=>b.tipo_movimento==="venda").map(b=>({Data:fmtDate(b.data_movimento),Qtd:b.quantidade,Cliente:b.cliente,Valor:b.valor,Operador:b.registrado_por_nome,Matrícula:b.registrado_por_matricula}))),"Vendas Biomassa");
    XLSX.writeFile(wb,`dados-utilidades-${todayISO()}.xlsx`);
    notify("Excel exportado!");
  };

  return(
    <div className="space-y-5">
      <div className="panel p-6">
        <div className="crumb mb-1">Centro de relatórios</div>
        <h2 className="text-2xl font-extrabold mb-2">Relatórios profissionais</h2>
        <p className="text-sm mb-5" style={{color:"var(--txt-2)"}}>Apenas registros validados por {NOME_VALIDADOR} são incluídos. O PDF contém indicadores, ocorrências, ranking de causas e biomassa, com cabeçalho corporativo e paginação automática.</p>
        <div className="flex flex-wrap gap-3 items-end">
          <div>
            <label>Período</label>
            <select value={period} onChange={e=>setPeriod(e.target.value)} style={{width:200}}>
              <option value="7">Últimos 7 dias</option>
              <option value="30">Últimos 30 dias</option>
              <option value="60">Últimos 60 dias</option>
              <option value="90">Últimos 90 dias</option>
              <option value="180">Últimos 6 meses</option>
              <option value="365">Últimos 12 meses</option>
            </select>
          </div>
          <button className="btn btn-primary" onClick={generate} disabled={busy}>
            {busy?<><span className="spinner"/>&nbsp;Gerando…</>:<><Icon name="report" size={15}/>Gerar PDF</>}
          </button>
          <button className="btn" onClick={exportXls}><Icon name="download" size={15}/>Exportar Excel</button>
        </div>
      </div>
      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
        {[
          {t:"Indicadores KPI",i:"trend-up",d:"MTBF, MTTR, disponibilidade e total de falhas por sistema."},
          {t:"Ranking de causas",i:"alert",d:"Top 10 causas mais frequentes no período."},
          {t:"Biomassa",i:"leaf",d:"Recebido, consumido, vendido, receita e eficiência térmica."},
        ].map(c=>(
          <div key={c.t} className="panel p-5">
            <div className="w-10 h-10 rounded-lg flex items-center justify-center mb-3" style={{background:"color-mix(in srgb,var(--acc) 14%,transparent)",color:"var(--acc)"}}>
              <Icon name={c.i}/>
            </div>
            <div className="font-bold">{c.t}</div>
            <div className="text-sm mt-1" style={{color:"var(--txt-3)"}}>{c.d}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ===================================================================== CONFIGURAÇÕES */
function SettingsPage(){
  const {user,theme,setTheme,isValidator}=useApp();
  return(
    <div className="space-y-5">
      <div className="panel p-6">
        <div className="crumb mb-1">Operador</div>
        <div className="font-bold text-lg mb-3">Sua identificação nesta sessão</div>
        <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div className="panel-flat p-3"><div className="crumb">Nome</div><div className="font-semibold mt-1">{user.nome}</div></div>
          <div className="panel-flat p-3"><div className="crumb">Matrícula</div><div className="font-semibold mono mt-1">{user.matricula}</div></div>
          <div className="panel-flat p-3"><div className="crumb">E-mail</div><div className="font-semibold mt-1 text-sm break-all">{user.email}</div></div>
        </div>
        {isValidator&&<div className="mt-3 panel-flat p-3 flex items-center gap-2 text-sm" style={{color:"var(--acc-5)"}}><Icon name="shield" size={15}/>Você é o <strong>VALIDADOR</strong> deste sistema. A aba "Pendentes" está disponível para você.</div>}
      </div>

      <div className="panel p-6">
        <div className="crumb mb-1">Aparência</div>
        <div className="font-bold text-lg mb-4">Tema</div>
        <div className="grid grid-cols-2 gap-3 max-w-sm">
          <button className={`panel-flat p-4 text-left ${theme==="dark"?"!border-[color:var(--acc)]":""}`} onClick={()=>setTheme("dark")}>
            <div className="flex items-center gap-2 mb-1"><Icon name="moon"/><span className="font-bold">Escuro</span></div>
            <div className="text-xs" style={{color:"var(--txt-3)"}}>Centro de controle</div>
          </button>
          <button className={`panel-flat p-4 text-left ${theme==="light"?"!border-[color:var(--acc)]":""}`} onClick={()=>setTheme("light")}>
            <div className="flex items-center gap-2 mb-1"><Icon name="sun"/><span className="font-bold">Claro</span></div>
            <div className="text-xs" style={{color:"var(--txt-3)"}}>Ambiente office</div>
          </button>
        </div>
      </div>

      <div className="panel p-6">
        <div className="crumb mb-1">Fluxo de validação</div>
        <div className="font-bold text-lg mb-3">Como funciona</div>
        <ol className="space-y-3 text-sm" style={{color:"var(--txt-2)"}}>
          {[
            "Qualquer operador identificado (nome + matrícula + e-mail) registra ocorrências e movimentações de biomassa.",
            `Após salvar, o cliente de e-mail do operador abre com mensagem pré-preenchida para ${NOME_VALIDADOR} (${EMAIL_VALIDADOR}). O operador clica Enviar.`,
            "O registro fica em status PENDENTE — não aparece no histórico nem nos contadores.",
            `${NOME_VALIDADOR} acessa a aba "Pendentes" e clica em Validar ou Rejeitar.`,
            "Se rejeitado, abre e-mail automático para o operador com o motivo dos ajustes necessários.",
            "Apenas registros VALIDADOS entram nos KPIs, gráficos, histórico e relatórios PDF.",
          ].map((s,i)=>(
            <li key={i} className="flex gap-3">
              <span className="mono font-bold text-[color:var(--acc)] w-6 shrink-0">0{i+1}</span>
              <span>{s}</span>
            </li>
          ))}
        </ol>
      </div>
    </div>
  );
}

/* ===================================================================== SHELL */
function Shell(){
  const {user}=useApp();
  const [active,setActive]=useState("home");
  const [mob,setMob]=useState(false);
  if(!user)return<LoginScreen/>;
  const render=()=>{
    switch(active){
      case "home":return<HomePage/>;
      case "termico":case "eletrica":case "refrigeracao":case "arComprimido":return<SysPage sysKey={active}/>;
      case "biomass":return<BiomassPage/>;
      case "pending":return<PendingPage/>;
      case "history":return<HistoryPage/>;
      case "reports":return<ReportsPage/>;
      case "settings":return<SettingsPage/>;
      default:return<HomePage/>;
    }
  };
  return(
    <div className="flex h-screen">
      <Sidebar active={active} setActive={setActive}/>
      {mob&&<><div className="mobile-overlay lg:hidden" onClick={()=>setMob(false)}/><div className="lg:hidden fixed left-0 top-0 z-50 h-full"><Sidebar mobile active={active} setActive={setActive} close={()=>setMob(false)}/></div></>}
      <main className="flex-1 flex flex-col h-screen overflow-hidden grid-bg">
        <TopBar active={active} openMobile={()=>setMob(true)}/>
        <div className="flex-1 overflow-y-auto p-5 lg:p-8">
          <div className="max-w-[1600px] mx-auto">{render()}</div>
        </div>
      </main>
    </div>
  );
}

function App(){return<Provider><Shell/></Provider>;}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
